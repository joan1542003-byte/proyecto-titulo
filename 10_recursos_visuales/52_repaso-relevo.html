<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso Relevo</title>
<!-- Página local: se abre con doble clic y guarda el avance solo en este computador (en el navegador). Usa la
     Instrument Sans instalada en el computador; no carga nada de internet ni guarda nada en la nube. -->
<style>
/* Diseño: la línea de Relevo. Papel cálido, tinta casi negra y los cuatro colores del logo, uno por parte de la
   presentación (1 amarillo, 2 celeste, 3 verde, 4 rosa). Una columna que se lee como un recorrido por la casa. */
:root {
  --bg: #F7F4F0; --surface: #FFFFFF; --surface-2: #EFEAE3; --ink: #141312; --muted: #6E6964; --line: #E4DED6;
  --on-color: #141312; --focus: #2F6FDF;
  --p1: #FFD54A; --p2: #9DD6F4; --p3: #B3E788; --p4: #F6A3CB; --lila: #C5B2F6;
  --ok: #2E8B57; --mid: #C98A00; --bad: #C2413A;
  --font: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px; --radius-s: 12px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141312; --surface: #1E1C1A; --surface-2: #282522; --ink: #F3EFEA; --muted: #ABA49C; --line: #36322E;
  --focus: #8EB6FF; --ok: #6CCB94; --mid: #E7B84A; --bad: #F08A84; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141312; --surface: #1E1C1A; --surface-2: #282522; --ink: #F3EFEA; --muted: #ABA49C; --line: #36322E;
  --focus: #8EB6FF; --ok: #6CCB94; --mid: #E7B84A; --bad: #F08A84; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
.wrap { max-width: 820px; margin: 0 auto; display: grid; gap: 20px }
h1, h2, h3 { line-height: 1.15; text-wrap: balance; margin: 0 }
h2 { font-size: 1.45rem; font-weight: 650; letter-spacing: -0.01em }
h3 { font-size: 1.1rem; font-weight: 650 }
p { margin: 0 }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px }
.muted { color: var(--muted) }
.small { font-size: .88rem }
.eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.num { font-variant-numeric: tabular-nums }

/* Cabecera */
header.top { padding-top: 22px; display: grid; gap: 14px }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em }
.logo svg { width: 34px; height: 34px; flex: none }
.estado { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px }
.estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted) }
.estado[data-e="local"]::before { background: var(--ok) }
.estado[data-e="error"]::before { background: var(--bad) }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px }
nav.tabs a { text-decoration: none; color: var(--ink); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 550; font-size: .95rem }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

/* Piezas comunes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 12px; min-width: 0 }
.stack { display: grid; gap: 12px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 600; min-height: 44px;
  display: inline-flex; align-items: center; gap: 8px }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.btn.ghost { background: transparent }
.btn[disabled] { opacity: .45; cursor: default }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-size: .88rem; font-weight: 550 }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink) }
.tag.tuya { background: color-mix(in srgb, var(--p1) 45%, var(--surface)); color: var(--on-color) }
.tal { background: color-mix(in srgb, var(--lila) 40%, var(--surface)); color: var(--on-color) }
.quote { font-size: 1.12rem; font-weight: 550; line-height: 1.45 }
ul.lista { margin: 0; padding-left: 1.1em; display: grid; gap: 6px }
.hint { border-radius: var(--radius-s); padding: 12px 14px; background: var(--surface-2) }
.mnemo { border-radius: var(--radius-s); padding: 12px 14px; background: color-mix(in srgb, var(--c, var(--p2)) 28%, var(--surface)); color: var(--ink) }
.oculto { filter: blur(7px); user-select: none; cursor: pointer }
.oculto:focus-visible { filter: blur(5px) }

/* Hoy */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 24px 22px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 10px }
.hero::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 70%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, color-mix(in srgb, var(--p1) 70%, transparent), transparent 62%),
              radial-gradient(circle at 70% 60%, color-mix(in srgb, var(--p4) 60%, transparent), transparent 60%);
  opacity: var(--aura, .55); pointer-events: none }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --aura: .28 } }
:root[data-theme="dark"] { --aura: .28 }
.hero > * { position: relative }
.cuenta { font-size: clamp(2.4rem, 8vw, 3.6rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1 }
.pasos { display: grid; gap: 10px }
.paso { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px }
.paso .check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0 }
.paso .check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff }
.paso .check svg { width: 16px; height: 16px }
.paso .body { display: grid; gap: 8px; min-width: 0 }

/* La casa */
.estacion { --c: var(--p1); display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; scroll-margin-top: 16px }
.estacion header { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center }
.circ { width: 46px; height: 46px; border-radius: 50%; background: var(--c); color: var(--on-color); display: grid; place-items: center; font-weight: 700; font-size: 1.2rem }
.lugar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.lugar label { font-size: .85rem; color: var(--muted) }
.lugar input { font: inherit; font-size: .95rem; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); min-width: 0; width: 14em; max-width: 100% }
.imagen { font-style: italic; color: var(--muted) }
.camino { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.camino span { font-size: .85rem; padding: 4px 10px; border-radius: 999px; background: var(--surface-2) }

/* Tarjetas */
.mazo { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px }
.mazo button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-s); padding: 12px 14px; display: grid; gap: 4px }
.flash { min-height: 260px; align-content: start }
.flash .q { font-size: 1.3rem; font-weight: 600; line-height: 1.35 }
.flash .a { font-size: 1.05rem; line-height: 1.55; white-space: pre-line; border-top: 1px dashed var(--line); padding-top: 12px }
.notas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.notas .btn { justify-content: center; text-align: center; border-radius: var(--radius-s); flex-direction: column; gap: 2px; padding: 10px 8px }
.notas .si { border-color: var(--ok) } .notas .me { border-color: var(--mid) } .notas .no { border-color: var(--bad) }
.barra { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden }
.barra > i { display: block; height: 100%; background: var(--ink) }

/* Preguntas */
details.preg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 }
details.preg > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: grid; gap: 6px }
details.preg > summary::-webkit-details-marker { display: none }
details.preg[open] > summary { border-bottom: 1px solid var(--line) }
.preg .q { font-weight: 600; font-size: 1.05rem }
.preg .cuerpo { padding: 16px 18px; display: grid; gap: 12px }
.rdl { display: grid; gap: 8px }
.rdl div { display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start }
.rdl b { display: grid; place-items: center; width: 2em; height: 2em; border-radius: 50%; background: var(--surface-2); font-size: .85rem }
.reloj { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em }
.anillo { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden }
.anillo > i { display: block; height: 100%; width: 100%; background: var(--p3); transform-origin: left; transition: transform .25s linear }

/* Plan */
.dia { display: grid; grid-template-columns: 5.6em 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; border-bottom: 1px solid var(--line) }
.dia:last-child { border-bottom: 0 }
.dia.hoy { background: color-mix(in srgb, var(--p1) 22%, var(--surface)) }
.dia .fecha { font-weight: 650; line-height: 1.2 }
.dia .fecha small { display: block; font-weight: 500; color: var(--muted) }
.dia .check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0 }
.dia .check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff }
.dia .check svg { width: 16px; height: 16px }
.semana { padding: 12px 16px; background: var(--surface-2); font-weight: 650 }
.planbox { padding: 0; overflow: hidden }

@media (max-width: 520px) {
  .card, .estacion { padding: 16px }
  .notas { grid-template-columns: 1fr }
  .dia { grid-template-columns: 4.6em 1fr auto }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="14" cy="14" r="9" fill="var(--p1)"/><circle cx="26" cy="14" r="9" fill="var(--p2)" opacity=".9"/><circle cx="26" cy="26" r="9" fill="var(--p3)" opacity=".9"/><circle cx="14" cy="26" r="9" fill="var(--p4)" opacity=".9"/></svg>
        <span>Repaso Relevo</span>
      </div>
      <span class="estado" id="estado" data-e="local" role="status" aria-live="polite">Se guarda en este computador</span>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <a href="#hoy" data-v="hoy">Hoy</a>
      <a href="#casa" data-v="casa">La casa</a>
      <a href="#tarjetas" data-v="tarjetas">Tarjetas</a>
      <a href="#preguntas" data-v="preguntas">Preguntas</a>
      <a href="#plan" data-v="plan">Plan</a>
      <a href="#metodo" data-v="metodo">Cómo estudiar</a>
    </nav>
  </header>
  <main id="vista" class="stack"></main>
</div>

<script>
/* ------------------------------------------------------------------ Contenido
   Todo sale de la memoria v8, el guion del examen (documento 49), la ficha de estudio (50) y el documento de la
   comisión (51), al 25 de noviembre de 2026. */

const EXAMEN = "2026-12-14";
const PARTES = {
  1: { nombre: "El problema", color: "var(--p1)" },
  2: { nombre: "Lo que investigué", color: "var(--p2)" },
  3: { nombre: "La propuesta", color: "var(--p3)" },
  4: { nombre: "La prueba", color: "var(--p4)" },

const FRASES = {
  una: "Relevo es una aplicación para Android y un objeto que suena junto al primer paso de una actividad, para que la persona recuerde a tiempo lo que quería hacer mientras descansa con el teléfono, con la decisión en sus manos.",

const ESTACIONES = [

    ],
    mnemo: "Te ACOmodas en el sofá y se te pasa: Atención ocupada, Continuidad sin final, Ocio juzgado.",

  { f: "2026-12-15", sem: 4, titulo: "Examen (segundo día)", estacion: null, temas: [], preg: [], min: 5, examen: true },
];
const SEMANAS = { 1: "Semana 1 · Entender la historia", 2: "Semana 2 · Recordar sin mirar", 3: "Semana 3 · Ensayar como en el examen", 4: "El examen" };

/* ------------------------------------------------------------------ Estado y guardado */
const INTERVALO = [0, 1, 2, 4, 7, 12];   // días hasta volver a ver una tarjeta, según su caja
const LS = "repaso-relevo-v1";
const base = () => ({ v: 1, t: 0, lugares: {}, cards: {}, preg: {}, dias: {}, pasos: {} });
let S = base();
function mezclar(obj) { const b = base(); for (const k of Object.keys(b)) if (obj && obj[k] !== undefined) b[k] = obj[k]; return b; }
function leerLocal() { try { const t = localStorage.getItem(LS); if (t) S = mezclar(JSON.parse(t)); } catch (e) {} }
function estado(e) {
  const el = document.getElementById("estado"); el.dataset.e = e;
  el.textContent = { local: "Se guarda en este computador", error: "Este navegador no deja guardar el avance" }[e];
}
function guardarLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); estado("local"); } catch (e) { estado("error"); } }
function cambio() { S.t = Date.now(); guardarLocal(); }

/* ------------------------------------------------------------------ Fechas */
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const hoy = () => iso(new Date());
const aFecha = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const sumar = (s, n) => { const d = aFecha(s); d.setDate(d.getDate() + n); return iso(d); };
const entre = (a, b) => Math.round((aFecha(b) - aFecha(a)) / 86400000);
const fmtLargo = (s) => new Intl.DateTimeFormat("es-CL", { weekday: "long", day: "numeric", month: "long" }).format(aFecha(s));
const fmtCorto = (s) => { const d = aFecha(s); return { dia: new Intl.DateTimeFormat("es-CL", { weekday: "short" }).format(d).replace(".", ""), num: d.getDate() + " " + new Intl.DateTimeFormat("es-CL", { month: "short" }).format(d).replace(".", "") }; };

function diaDePlan() {
  const h = hoy();
  const exacto = PLAN.find((p) => p.f === h);
  if (exacto) return { p: exacto, cuando: "hoy" };
  if (h < PLAN[0].f) return { p: PLAN[0], cuando: "antes" };
  return { p: PLAN[PLAN.length - 1], cuando: "despues" };
}
function temasAbiertos() {
  const tope = hoy() < PLAN[0].f ? PLAN[0].f : hoy();
  const s = new Set(); PLAN.forEach((p) => { if (p.f <= tope) p.temas.forEach((t) => s.add(t)); });
  return s;
}

/* ------------------------------------------------------------------ Utilidades de texto */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  reloj: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>',
  ojo: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
};
const colorParte = (n) => PARTES[n].color;

/* ------------------------------------------------------------------ Tarjetas: repetición espaciada */
function pendientes() {
  const h = hoy(), abiertos = temasAbiertos(), vencidas = [], nuevas = [];
  for (const c of TARJETAS) {
    if (!abiertos.has(c.tema)) continue;
    const st = S.cards[c.id];
    if (!st) nuevas.push(c); else if (st.d <= h) vencidas.push(c);
  }
  vencidas.sort((a, b) => S.cards[a.id].b - S.cards[b.id].b);
  return { vencidas, nuevas };
}
let sesion = null;
function empezarSesion(tema, debiles) {
  let lista;
  if (tema) lista = TARJETAS.filter((c) => c.tema === tema);
  else if (debiles) lista = TARJETAS.filter((c) => S.cards[c.id] && S.cards[c.id].l && S.cards[c.id].l !== "si");
  else { const p = pendientes(); lista = [...p.vencidas, ...p.nuevas]; }
  sesion = { cola: lista.map((c) => c.id), i: 0, vista: false, repes: {}, hechas: 0, total: lista.length, libre: !!(tema || debiles) };
}
function calificar(nota) {
  const id = sesion.cola[sesion.i], h = hoy();
  const st = Object.assign({ b: 0, n: 0 }, S.cards[id]);
  st.n += 1; st.l = nota;
  if (nota === "si") { st.b = Math.min(5, st.b + 1); st.d = sumar(h, INTERVALO[st.b]); }
  else if (nota === "medias") { st.b = Math.max(1, st.b); st.d = sumar(h, 1); }
  else { st.b = 1; st.d = h; if ((sesion.repes[id] || 0) < 2) { sesion.repes[id] = (sesion.repes[id] || 0) + 1; sesion.cola.push(id); } }
  S.cards[id] = st; sesion.i += 1; sesion.vista = false; sesion.hechas += 1;
  cambio(); render();
}

/* ------------------------------------------------------------------ Temporizador compartido */
let reloj = null;
function iniciarReloj(clave, segundos) {
  pararReloj();
  const fin = Date.now() + segundos * 1000;
  reloj = { clave, fin, segundos, id: setInterval(() => pintarReloj(), 200) };
  pintarReloj();
}
function pararReloj() { if (reloj) { clearInterval(reloj.id); reloj = null; } }
function pintarReloj() {
  if (!reloj) return;
  const resto = Math.max(0, reloj.fin - Date.now());
  document.querySelectorAll('[data-reloj="' + reloj.clave + '"]').forEach((el) => {
    const n = el.querySelector(".reloj"), barra = el.querySelector(".anillo > i");
    if (n) n.textContent = resto > 0 ? Math.ceil(resto / 1000) + " s" : "Tiempo";
    if (barra) barra.style.transform = "scaleX(" + (resto / (reloj.segundos * 1000)) + ")";
  });
  if (resto <= 0) {
    const clave = reloj.clave; pararReloj();
    const det = document.querySelector('[data-mostrar="' + clave + '"]'); if (det) det.hidden = false;
  }
}

/* ------------------------------------------------------------------ Vistas */
let vista = "hoy";
let filtroQuien = "todas", soloTuyas = false, tarjetaTema = null, practica = false, simul = null;
const verFrase = { una: false, tres: false };

function render() {
  const main = document.getElementById("vista");
  document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.v === vista ? "page" : "false"));
  main.innerHTML = ({ hoy: vHoy, casa: vCasa, tarjetas: vTarjetas, preguntas: vPreguntas, plan: vPlan, metodo: vMetodo }[vista] || vHoy)();
}

function bloqueFrase(clave, titulo) {

    <p class="quote ${verFrase[clave] ? "" : "oculto"}" data-act="frase" data-k="${clave}" tabindex="0">${fmt(FRASES[clave])}</p></div>`;
}

function vHoy() {
  const { p, cuando } = diaDePlan(), h = hoy();
  const faltan = entre(h, EXAMEN);
  const n = PLAN.findIndex((x) => x.f === p.f) + 1;

  const paso = (k, titulo, cuerpo) => `<div class="paso"><button class="check" type="button" aria-pressed="${hecho(k)}" aria-label="Marcar paso: ${esc(titulo)}" data-act="paso" data-k="${k}">${hecho(k) ? ICON.check : ""}</button><div class="body"><h3>${titulo}</h3>${cuerpo}</div></div>`;
  let pasos = "";

  } else {

    if (p.estacion) { const e = ESTACIONES[p.estacion - 1];
      pasos += paso("p2", `Estación ${e.n} · ${esc(e.titulo)}`, `<p>Lee la estación, cierra los ojos y cuéntala en 20 segundos.</p><div class="row"><a class="btn primary" href="#casa-${e.n}">Ir a ${esc(nombreLugar(e))}</a></div>`); }
    pasos += paso("p3", "Tarjetas", `<p class="num">${totalPend ? `${totalPend} para hoy: ${pend.vencidas.length} de repaso y ${pend.nuevas.length} nuevas.` : "No te quedan tarjetas para hoy."}</p><div class="row"><button class="btn ${totalPend ? "primary" : ""}" type="button" data-act="ir-tarjetas"${totalPend ? "" : " disabled"}>Empezar tarjetas</button></div>`);
    if (p.preg.length) pasos += paso("p4", p.preg.length > 2 ? "Preguntas de la comisión" : "Preguntas del día",
      `<p>Respóndelas en voz alta con el cronómetro, antes de leer la respuesta.</p><ul class="lista">${p.preg.map((id) => { const q = PREGUNTAS.find((x) => x.id === id); return `<li><a href="#pregunta-${id}">${esc(q.q)}</a></li>`; }).join("")}</ul>`);
    if (p.simulacro) pasos += paso("p5", `Simulacro de ${p.simulacro} preguntas`, `<p>Preguntas al azar, una tras otra, con 90 segundos cada una. Primero las que menos has practicado.</p><div class="row"><button class="btn primary" type="button" data-act="simulacro" data-k="${p.simulacro}">Empezar simulacro</button></div>`);
    if (p.debiles) pasos += paso("p6", "Lo que más cuesta", `<p>Las tarjetas que marcaste No o A medias, y las preguntas en que te trabaste.</p><div class="row"><button class="btn primary" type="button" data-act="debiles">Repasar tarjetas débiles</button><a class="btn" href="#preguntas">Ver preguntas</a></div>`);
    pasos += paso("p9", "Antes de dormir · 2 min", `<p>Recorre la casa en tu mente, de la puerta a la ventana, y di una frase en cada lugar. Lo que repasas antes de dormir se fija mejor.</p>`);
  }
  const cabeza = cuando === "antes" ? `Empiezas el ${fmtLargo(p.f)}. Puedes adelantar hoy el primer día.` : cuando === "despues" ? "El examen ya pasó. Puedes seguir repasando cuando quieras." : p.examen ? `Hoy, ${fmtLargo(h)}` : `Hoy, ${fmtLargo(h)} · día ${n} de ${PLAN.length - 2}`;
  const grande = p.examen && cuando === "hoy" ? "Hoy es el examen" : cuando === "despues" ? "Examen terminado" : faltan === 1 ? "Falta 1 día" : `Faltan ${faltan} días`;
  return `<section class="hero">

      <p class="muted">${p.min} minutos${p.nota ? " · " + esc(p.nota) : ""}</p>
    </section>
    <section class="pasos" aria-label="Pasos de hoy">${pasos}</section>
    <div class="row"><button class="btn ${S.dias[p.f] ? "" : "primary"}" type="button" data-act="dia" data-k="${p.f}">${S.dias[p.f] ? ICON.check + " Día hecho" : "Marcar el día como hecho"}</button>
    <span class="muted small">Si un día no puedes, sigue al siguiente. Aquí no hay rachas.</span></div>`;
}

function nombreLugar(e) { return (S.lugares[e.n] || "").trim() || e.lugar.toLowerCase(); }

}

function vPreguntas() {
  if (simul && simul.i < simul.ids.length) {
    const q = PREGUNTAS.find((x) => x.id === simul.ids[simul.i]);
    return `<section class="card"><div class="row" style="justify-content:space-between"><h2>Simulacro</h2><span class="muted num">${simul.i + 1} de ${simul.ids.length}</span></div>

      <div class="row"><button class="btn primary" type="button" data-act="sim-sig">${simul.i + 1 < simul.ids.length ? "Siguiente pregunta" : "Terminar"}</button><button class="btn ghost" type="button" data-act="sim-fin">Salir del simulacro</button></div>`;
  }
  if (simul) simul = null;
  const chips = ["todas", "aaron", "sofia", "ambos", "cualquiera", "guion"].map((k) => `<button class="chip" type="button" aria-pressed="${filtroQuien === k}" data-act="filtro" data-k="${k}">${k === "todas" ? "Todas" : esc(QUIEN[k])}</button>`).join("");
  const lista = PREGUNTAS.filter((q) => (filtroQuien === "todas" || q.quien === filtroQuien || (q.quien === "ambos" && (filtroQuien === "aaron" || filtroQuien === "sofia"))) && (!soloTuyas || q.tuya));
  const practicadas = PREGUNTAS.filter((q) => S.preg[q.id] && S.preg[q.id].n).length;
  return `<section class="card">
      <h2>Preguntas de la comisión</h2>
      <p>Quince salen del documento de la comisión: lo que Aarón Montoya-Moraga y Sofía Suazo preguntaron en el Seminario y lo que pueden mirar ahora. Las demás son las del guion. Cada respuesta sigue la misma fórmula.</p>
      <div class="rdl"><div><b>R</b><p><strong>Respuesta:</strong> una frase directa. Sí, no, o la idea central.</p></div><div><b>D</b><p><strong>Dato:</strong> una cifra, un caso o el capítulo de la memoria.</p></div><div><b>L</b><p><strong>Límite o lo que sigue:</strong> qué no puedes afirmar y cómo lo probarías.</p></div></div>
      <p class="num"><b>${practicadas}</b> de ${PREGUNTAS.length} practicadas.</p>
      <div class="row"><button class="btn primary" type="button" data-act="simulacro" data-k="5">Simulacro de 5</button><button class="btn" type="button" data-act="simulacro" data-k="10">Simulacro de 10</button></div>
    </section>
    <section class="card"><h3>Si no sabes qué decir</h3><p class="small muted">Frases puente: te dan tiempo y te llevan a lo que sí sabes.</p><ul class="lista">${PUENTES.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></section>
    <div class="row">${chips}<button class="chip" type="button" aria-pressed="${soloTuyas}" data-act="tuyas">Solo las que debes decidir</button></div>
    <section class="stack">${lista.map((q) => bloquePregunta(q, false)).join("")}</section>`;
}

function vPlan() {
  let html = "", sem = 0;
  const h = hoy();
  for (const p of PLAN) {
    if (p.sem !== sem) { sem = p.sem; html += `<div class="semana">${esc(SEMANAS[sem])}</div>`; }
    const f = fmtCorto(p.f), tareas = [];
    if (p.estacion) tareas.push(`Estación ${p.estacion}`);
    if (p.temas.length) tareas.push("tarjetas: " + p.temas.map((t) => TEMAS[t].nombre.toLowerCase()).join(" y "));
    if (p.preg.length) tareas.push(`${p.preg.length} ${p.preg.length === 1 ? "pregunta" : "preguntas"}`);
    if (p.simulacro) tareas.push(`simulacro de ${p.simulacro}`);
    html += `<div class="dia${p.f === h ? " hoy" : ""}"><div class="fecha">${esc(f.dia)}<small class="num">${esc(f.num)}</small></div>
      <div class="stack" style="gap:2px"><b>${esc(p.titulo)}</b><span class="small muted">${p.min} min${tareas.length ? " · " + esc(tareas.join(" · ")) : ""}</span>${p.nota ? `<span class="small">${esc(p.nota)}</span>` : ""}</div>
      ${p.examen ? "<span></span>" : `<button class="check" type="button" aria-pressed="${!!S.dias[p.f]}" aria-label="Marcar ${esc(f.dia + " " + f.num)} como hecho" data-act="dia" data-k="${p.f}">${S.dias[p.f] ? ICON.check : ""}</button>`}</div>`;
  }
  const hechos = PLAN.filter((p) => S.dias[p.f]).length;
  return `<section class="card"><h2>El plan</h2><p>Dieciocho días de estudio, de 10 a 45 minutos. La primera semana es corta porque entregas la memoria el 1 de diciembre. La segunda es para recordar sin mirar. La tercera, para ensayar como en el examen.</p><p class="num muted">${hechos} días hechos.</p></section>
    <section class="card planbox">${html}</section>`;
}

function vMetodo() {
  const reglas = [
    ["Un primer paso pequeño", "Empieza siempre igual: di la frase de Relevo en voz alta. Empezar es lo que más cuesta, y un paso concreto lo vuelve fácil. Es el criterio 2 de tu propio proyecto."],
    ["Una señal en un lugar", "Cada parte del proyecto vive en un lugar de tu casa. Al recorrerla en la mente, la historia sale en orden. Es la memoria prospectiva: un lugar trae de vuelta lo que dejaste ahí."],
    ["Recordar antes de mirar", "Cada tarjeta y cada pregunta se responden en voz alta antes de ver la respuesta. Es lo que medía Relevo. El esfuerzo de recordar es lo que fija el recuerdo, aunque te equivoques."],
    ["Volver a lo que cuesta", "Lo que no supiste vuelve hoy o mañana; lo que supiste, en unos días. Así repasas menos y recuerdas más."],
    ["Decirlo como en el examen", "En voz alta, con cronómetro y con la fórmula: respuesta, dato y límite. Si puedes, explícaselo a alguien que no sepa nada del tema."],
    ["Sin culpa", "No hay rachas. Si un día no puedes, sigue al siguiente: el plan se acomoda. Es el criterio 4 de Relevo: nada de evaluar el cumplimiento."],
    ["Dormir", "Lo que repasas antes de dormir se fija mejor. Termina cada día recorriendo la casa."],
  ];
  const mnemos = [
    ["Tres causas", "Te ACOmodas en el sofá: Atención ocupada, Continuidad sin final, Ocio juzgado."],
    ["Tres ámbitos", "Sofá, imán y nudo en el dedo: el ocio, la atención y la memoria."],
    ["Ocho criterios", "2 · 3 · 3: dos de la persona, tres de las decisiones y tres del esfuerzo."],
    ["Tres supuestos", "A-D-S, ADióS al olvido: Asociación, Decisión, Soporte."],
    ["Cuatro momentos", "Pon Su Oído y Decide: Preparar, Seguir, Oír, Decidir."],
    ["Cuatro colores", "Sol el tiempo, cielo el primer paso, pasto el lugar y corazón la decisión."],
    ["Las cifras de la prueba", "21 es la base. 19, 21 y 10: casi todas, todas y la mitad. 23 de 24: todas menos una, fuera de casa."],
  ];
  return `<section class="card"><h2>Cómo estudiar</h2>
      <p>Este método usa las mismas ideas que Relevo. Si en el examen te preguntan cómo te preparaste, también es una buena respuesta.</p>
      <ul class="lista">${reglas.map(([t, x]) => `<li><b>${esc(t)}.</b> ${esc(x)}</li>`).join("")}</ul></section>
    <section class="card"><h3>Relevo en tres tamaños</h3><p class="muted small">Aprende primero la frase corta. Cuando salga sola, pasa a la de tres frases. Al final, la casa completa.</p>
      ${bloqueFrase("una", "Una frase")}${bloqueFrase("tres", "Tres frases")}
      <p><b>La casa completa, unos 3 minutos:</b> la frase de 20 segundos de cada lugar, de la puerta a la ventana. <a href="#casa">Ir a la casa</a>.</p></section>
    <section class="card"><h3>Para recordar las listas</h3><ul class="lista">${mnemos.map(([t, x]) => `<li><b>${esc(t)}.</b> ${esc(x)}</li>`).join("")}</ul></section>
    <section class="card"><h3>Cómo responder a la comisión</h3>
      <div class="rdl"><div><b>R</b><p><strong>Respuesta:</strong> una frase directa.</p></div><div><b>D</b><p><strong>Dato:</strong> una cifra, un caso o el capítulo.</p></div><div><b>L</b><p><strong>Límite o lo que sigue:</strong> qué no puedes afirmar y cómo lo probarías.</p></div></div>
      <p class="hint"><b>Ejemplo.</b> ¿Por qué un objeto y no una notificación? R: Porque la notificación llega a la misma pantalla que tiene tu atención, y el objeto suena fuera de ella, donde empieza la actividad. D: Con el teléfono, el aviso se notó tarde o no se notó en 10 de 21 respuestas. L: Pero el orden de las etapas no permite decir cuál ayuda más; eso lo compararía el protocolo de 21 días.</p>
      <p>Si una respuesta depende de una decisión tuya, como el sueño o el precio, la pregunta lo dice. Revísala y escríbela con tus palabras.</p></section>
    <section class="card"><h3>El día del examen</h3><ul class="lista"><li>Antes de entrar: respira lento tres veces, di la frase de Relevo y recorre la casa en un minuto.</li><li>Escucha la pregunta entera. Si no la entendiste, pide que la repitan.</li><li>Responde corto: respuesta, dato y límite. Callar después de responder está bien.</li><li>Si te quedas en blanco, usa una frase puente y vuelve a la puerta de tu casa.</li></ul></section>`;
}

/* ------------------------------------------------------------------ Eventos */
function mostrarVista(desdeHash) {
  const h = (location.hash || "#hoy").slice(1);
  let v = h, ancla = null;
  if (h.startsWith("casa-")) { v = "casa"; ancla = h; }
  else if (h.startsWith("pregunta-")) { v = "preguntas"; ancla = h; }
  if (!["hoy", "casa", "tarjetas", "preguntas", "plan", "metodo"].includes(v)) v = "hoy";
  if (v !== "preguntas") simul = null;
  if (v === "preguntas" && ancla) { filtroQuien = "todas"; soloTuyas = false; }
  vista = v; pararReloj(); render();
  if (ancla) { const el = document.getElementById(ancla); if (el) { if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView({ block: "start" }); } }
  else if (desdeHash) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => mostrarVista(true));

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, k = el.dataset.k;
  if (act === "frase") { verFrase[k] = !verFrase[k]; render(); }
  else if (act === "paso") { const p = diaDePlan().p; S.pasos[p.f] = Object.assign({}, S.pasos[p.f]); S.pasos[p.f][k] = !S.pasos[p.f][k]; cambio(); render(); }
  else if (act === "dia") { S.dias[k] = !S.dias[k]; cambio(); render(); }
  else if (act === "ir-tarjetas") { empezarSesion(); location.hash = "#tarjetas"; if (vista === "tarjetas") render(); }
  else if (act === "empezar") { empezarSesion(); render(); window.scrollTo(0, 0); }
  else if (act === "debiles") { empezarSesion(null, true); if (!sesion.cola.length) { sesion = null; } location.hash = "#tarjetas"; render(); window.scrollTo(0, 0); }
  else if (act === "mazo") { tarjetaTema = k; empezarSesion(k); render(); window.scrollTo(0, 0); }
  else if (act === "mostrar") { sesion.vista = true; render(); }
  else if (act === "nota") calificar(k);
  else if (act === "salir") { sesion = null; render(); }
  else if (act === "practica") { practica = !practica; render(); }
  else if (act === "destapar") el.classList.remove("oculto");
  else if (act === "reloj") iniciarReloj(k, Number(el.dataset.s));
  else if (act === "ver-resp") { const d = document.querySelector('[data-mostrar="' + k + '"]'); if (d) d.hidden = false; pararReloj(); }
  else if (act === "calif") { const id = el.dataset.id, st = Object.assign({ n: 0 }, S.preg[id]); st.n += 1; st.nota = k; st.f = hoy(); S.preg[id] = st; cambio(); render(); const d = document.getElementById("pregunta-" + id); if (d) d.open = true; const m = document.querySelector('[data-mostrar="q-' + id + '"]'); if (m) m.hidden = false; }
  else if (act === "filtro") { filtroQuien = k; render(); }
  else if (act === "tuyas") { soloTuyas = !soloTuyas; render(); }
  else if (act === "simulacro") {
    const n = Number(k), peso = (q) => { const st = S.preg[q.id]; if (!st || !st.n) return 0; return { trabe: 1, medias: 2, bien: 3 }[st.nota] || 2; };
    const orden = PREGUNTAS.map((q) => ({ q, w: peso(q) + Math.random() })).sort((a, b) => a.w - b.w).slice(0, n).map((x) => x.q.id);
    simul = { ids: orden, i: 0 }; location.hash = "#preguntas"; render(); window.scrollTo(0, 0);
  }
  else if (act === "sim-sig") { simul.i += 1; pararReloj(); render(); window.scrollTo(0, 0); }
  else if (act === "sim-fin") { simul = null; pararReloj(); render(); }
});
document.addEventListener("keydown", (ev) => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches('[data-act="destapar"], p[data-act="frase"]')) { ev.preventDefault(); ev.target.click(); }
});
let tLugar = null;
document.addEventListener("input", (ev) => {
  const el = ev.target; if (el.dataset.act !== "lugar") return;
  S.lugares[el.dataset.k] = el.value.slice(0, 40);
  clearTimeout(tLugar); tLugar = setTimeout(() => { cambio(); const c = document.querySelector(".camino"); if (c) c.innerHTML = ESTACIONES.map((e) => `<span>${e.n}. ${esc(nombreLugar(e))}</span>`).join(""); }, 500);
});

leerLocal();
mostrarVista(false);
</script>
</body>
</html>
