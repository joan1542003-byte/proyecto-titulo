<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso Relevo</title>
<meta name="description" content="Plan diario para estudiar Relevo hasta el examen de título.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repaso Relevo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23FFD54A' d='M75.261 14.757A29 29 0 1 0 35.757 54.261A35.5 35.5 0 0 1 75.261 14.757Z'/%3E%3Cpath fill='%239DD6F4' d='M85.243 75.261A29 29 0 1 0 45.739 35.757A35.5 35.5 0 0 1 85.243 75.261Z'/%3E%3Cpath fill='%23B3E788' d='M24.739 85.243A29 29 0 1 0 64.243 45.739A35.5 35.5 0 0 1 24.739 85.243Z'/%3E%3Cpath fill='%23F6A3CB' d='M14.757 24.739A29 29 0 1 0 54.261 64.243A35.5 35.5 0 0 1 14.757 24.739Z'/%3E%3C/svg%3E">
<!-- Repaso Relevo. Funciona de dos formas con el mismo archivo:
     - como página local: se abre con doble clic y guarda el avance en ese navegador;
     - como sitio en GitHub Pages: se abre en el teléfono, se instala como app y funciona sin internet.
     El avance nunca sale del navegador: no hay servidor ni cuentas. Para pasarlo a otro dispositivo se usa una copia. -->
<style>
/* Diseño: la línea de Relevo. Papel cálido, tinta casi negra y los cuatro colores del logo, uno por parte de la
   presentación (1 amarillo, 2 celeste, 3 verde, 4 rosa). Una columna que se lee como un recorrido por la casa. */
:root {
  --bg: #F7F4F0; --surface: #FFFFFF; --surface-2: #EFEAE3; --ink: #141312; --muted: #6E6964; --line: #E4DED6;
  --on-color: #141312; --focus: #2F6FDF;
  --p1: #FFD54A; --p2: #9DD6F4; --p3: #B3E788; --p4: #F6A3CB; --lila: #C5B2F6;
  --ok: #2E8B57; --mid: #C98A00; --bad: #C2413A;
  --font: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px; --radius-s: 12px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141312; --surface: #1E1C1A; --surface-2: #282522; --ink: #F3EFEA; --muted: #ABA49C; --line: #36322E;
  --focus: #8EB6FF; --ok: #6CCB94; --mid: #E7B84A; --bad: #F08A84; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141312; --surface: #1E1C1A; --surface-2: #282522; --ink: #F3EFEA; --muted: #ABA49C; --line: #36322E;
  --focus: #8EB6FF; --ok: #6CCB94; --mid: #E7B84A; --bad: #F08A84; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px }
.wrap { max-width: 820px; margin: 0 auto; display: grid; gap: 20px }
h1, h2, h3 { line-height: 1.15; text-wrap: balance; margin: 0 }
h2 { font-size: 1.45rem; font-weight: 650; letter-spacing: -0.01em }
h3 { font-size: 1.1rem; font-weight: 650 }
p { margin: 0 }
a { color: inherit }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px }
.muted { color: var(--muted) }
.small { font-size: .88rem }
.eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.num { font-variant-numeric: tabular-nums }

/* Cabecera fija: el menú se desliza de lado en el teléfono */
header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); margin-inline: -16px; padding: 12px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line) }
.brand { display: flex; align-items: center; gap: 12px; justify-content: space-between }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em }
.logo svg { width: 30px; height: 30px; flex: none }
.estado { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px }
.estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted) }
.estado[data-e="ok"]::before { background: var(--ok) }
.estado[data-e="error"]::before { background: var(--bad) }
nav.tabs { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 0 16px 2px }
nav.tabs::-webkit-scrollbar { display: none }
nav.tabs a { flex: none; white-space: nowrap; text-decoration: none; color: var(--ink); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 550; font-size: .95rem }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
@media (min-width: 860px) { nav.tabs { flex-wrap: wrap; overflow: visible } }

/* Piezas comunes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 12px; min-width: 0 }
.stack { display: grid; gap: 12px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 600; min-height: 44px;
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink) }
.btn svg { flex: none }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.btn.ghost { background: transparent }
.btn.big { font-size: 1.05rem; padding: 13px 22px; min-height: 52px }
.btn[disabled] { opacity: .45; cursor: default }
.btn.rec { border-color: var(--bad); color: var(--bad) }
.btn.rec::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); animation: latido 1s infinite }
@keyframes latido { 50% { opacity: .3 } }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-size: .88rem; font-weight: 550; min-height: 36px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink) }
.tag.tuya { background: color-mix(in srgb, var(--p1) 45%, var(--surface)); color: var(--on-color) }
.tal { background: color-mix(in srgb, var(--lila) 40%, var(--surface)); color: var(--on-color) }
.quote { font-size: 1.12rem; font-weight: 550; line-height: 1.45 }
ul.lista, ol.lista { margin: 0; padding-left: 1.2em; display: grid; gap: 6px }
.hint { border-radius: var(--radius-s); padding: 12px 14px; background: var(--surface-2) }
.mnemo { border-radius: var(--radius-s); padding: 12px 14px; background: color-mix(in srgb, var(--c, var(--p2)) 28%, var(--surface)); color: var(--ink) }
.oculto { filter: blur(7px); user-select: none; -webkit-user-select: none; cursor: pointer }
.oculto:focus-visible { filter: blur(5px) }
textarea { font: inherit; font-size: .85rem; width: 100%; min-height: 84px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 10px 12px; word-break: break-all }
select, input[type="time"] { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); min-height: 40px }
.campo { display: grid; gap: 4px } .campo > span { font-size: .85rem; color: var(--muted) }
.ajustes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.aviso { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px;
  border-radius: 12px; font-weight: 550; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25) }
.reproductor { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); z-index: 30; background: var(--ink); color: var(--bg);
  border-radius: 999px; padding: 6px 6px 6px 16px; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: calc(100% - 32px) }
.reproductor span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center }
.reproductor .btn { background: var(--bg); color: var(--ink); border-color: var(--bg); min-height: 36px; padding: 6px 14px }
.grab { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.grab audio { height: 40px; max-width: 100% }
.teclas { display: block }
@media (pointer: coarse) { .teclas { display: none } }

/* Hoy */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 24px 22px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 10px }
.hero::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 70%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, color-mix(in srgb, var(--p1) 70%, transparent), transparent 62%),
              radial-gradient(circle at 70% 60%, color-mix(in srgb, var(--p4) 60%, transparent), transparent 60%);
  opacity: var(--aura, .55); pointer-events: none }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --aura: .28 } }
:root[data-theme="dark"] { --aura: .28 }
.hero > * { position: relative }
.cuenta { font-size: clamp(2.4rem, 8vw, 3.6rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1 }
.tiempos { display: flex; flex-wrap: wrap; gap: 8px }
.tiempos .chip { font-size: 1rem; padding: 10px 16px; min-height: 44px }
.plan-hoy { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: p }
.plan-hoy li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; counter-increment: p }
.plan-hoy li::before { content: counter(p); width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 650; font-size: .9rem }
.guia-top { display: grid; gap: 8px }
.pasitos { display: flex; gap: 5px }
.pasitos i { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2) }
.pasitos i.ok { background: var(--ink) }
.pasitos i.ya { background: var(--p3) }

/* La casa */
.estacion { --c: var(--p1); display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; scroll-margin-top: 120px }
.estacion header { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center }
.circ { width: 46px; height: 46px; border-radius: 50%; background: var(--c); color: var(--on-color); display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; flex: none }
.circ.chico { width: 30px; height: 30px; font-size: .9rem }
.lugar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.lugar label { font-size: .85rem; color: var(--muted) }
.lugar input { font: inherit; font-size: .95rem; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); min-width: 0; width: 14em; max-width: 100% }
.imagen { font-style: italic; color: var(--muted) }
.camino { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.camino span { font-size: .85rem; padding: 4px 10px; border-radius: 999px; background: var(--surface-2) }
.recorrido { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px }
.recorrido li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start }
.recorrido li > div { display: grid; gap: 6px; min-width: 0 }
.grupos { display: flex; flex-wrap: wrap; gap: 8px }
.grupo { border-radius: var(--radius-s); padding: 10px 12px; background: color-mix(in srgb, var(--c, var(--p2)) 22%, var(--surface)); display: grid; gap: 4px; flex: 1 1 160px }
.grupo b { font-size: .95rem }
.flujo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.flujo span { padding: 6px 12px; border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: .9rem }
.flujo i { color: var(--muted); font-style: normal }
.leyenda { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center }
.leyenda svg { width: 64px; height: 64px }
.leyenda ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px }
.leyenda li { display: flex; gap: 8px; align-items: center }

/* Tarjetas */
.mazo { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px }
.mazo button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-s); padding: 12px 14px; display: grid; gap: 4px }
.flash { min-height: 260px; align-content: start }
.flash .q { font-size: 1.3rem; font-weight: 600; line-height: 1.35 }
.flash .a { font-size: 1.05rem; line-height: 1.55; white-space: pre-line; border-top: 1px dashed var(--line); padding-top: 12px }
.notas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.notas .btn { justify-content: center; text-align: center; border-radius: var(--radius-s); flex-direction: column; gap: 2px; padding: 10px 8px; min-height: 60px }
.notas .si { border-color: var(--ok) } .notas .me { border-color: var(--mid) } .notas .no { border-color: var(--bad) }
.barra { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden }
.barra > i { display: block; height: 100%; background: var(--c, var(--ink)) }
.viz { display: grid; gap: 10px }
.viz > div { display: grid; gap: 4px }
.viz svg { display: block; width: 100%; max-width: 440px; height: auto }

/* Cifras */
.ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.ops button { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius-s); padding: 12px 14px; font-weight: 600;
  font-size: 1rem; min-height: 56px; display: flex; gap: 10px; align-items: center; line-height: 1.3 }
.ops button .k { width: 1.8em; height: 1.8em; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: .8rem; flex: none }
.ops button.bien { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--surface)) }
.ops button.mal { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)) }
.ops button[disabled] { cursor: default }
.ops button[disabled]:not(.bien):not(.mal) { opacity: .55 }

/* Preguntas */
details.preg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0; scroll-margin-top: 120px }
details.preg > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: grid; gap: 6px }
details.preg > summary::-webkit-details-marker { display: none }
details.preg[open] > summary { border-bottom: 1px solid var(--line) }
.preg .q { font-weight: 600; font-size: 1.05rem }
.preg .cuerpo { padding: 16px 18px; display: grid; gap: 12px }
.rdl, .claves { display: grid; gap: 8px }
.rdl > div, .claves > div { display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start }
.rdl b, .claves b { display: grid; place-items: center; width: 2em; height: 2em; border-radius: 50%; background: var(--surface-2); font-size: .85rem }
.claves { border-radius: var(--radius-s); padding: 12px 14px; background: color-mix(in srgb, var(--p1) 22%, var(--surface)) }
.claves p { font-weight: 600 }
.reloj { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em }
.anillo { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden }
.anillo > i { display: block; height: 100%; width: 100%; background: var(--p3); transform-origin: left; transition: transform .25s linear }

/* Plan y avance */
.dia { display: grid; grid-template-columns: 5.6em 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; border-bottom: 1px solid var(--line) }
.dia:last-child { border-bottom: 0 }
.dia.hoy { background: color-mix(in srgb, var(--p1) 22%, var(--surface)) }
.dia .fecha { font-weight: 650; line-height: 1.2 }
.dia .fecha small { display: block; font-weight: 500; color: var(--muted) }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; flex: none }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff }
.check svg { width: 16px; height: 16px }
.semana { padding: 12px 16px; background: var(--surface-2); font-weight: 650 }
.planbox { padding: 0; overflow: hidden }
.medidores { display: grid; gap: 10px }
.medidor { display: grid; grid-template-columns: minmax(0, 11em) 1fr auto; gap: 10px; align-items: center }
.medidor .barra { height: 10px }
.cifra-grande { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px }
.cifra-grande div { background: var(--surface-2); border-radius: var(--radius-s); padding: 12px 14px; display: grid; gap: 2px }
.cifra-grande b { font-size: 1.6rem; letter-spacing: -0.02em; line-height: 1.1 }

@media (max-width: 520px) {
  .card, .estacion { padding: 16px }
  .notas { grid-template-columns: 1fr }
  .ops { grid-template-columns: 1fr }
  .dia { grid-template-columns: 4.6em 1fr auto }
  .medidor { grid-template-columns: 1fr auto; } .medidor .barra { grid-column: 1 / -1; grid-row: 2 }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path style="fill:var(--p1)" d="M75.261 14.757A29 29 0 1 0 35.757 54.261A35.5 35.5 0 0 1 75.261 14.757Z"/><path style="fill:var(--p2)" d="M85.243 75.261A29 29 0 1 0 45.739 35.757A35.5 35.5 0 0 1 85.243 75.261Z"/><path style="fill:var(--p3)" d="M24.739 85.243A29 29 0 1 0 64.243 45.739A35.5 35.5 0 0 1 24.739 85.243Z"/><path style="fill:var(--p4)" d="M14.757 24.739A29 29 0 1 0 54.261 64.243A35.5 35.5 0 0 1 14.757 24.739Z"/></svg>
        <span>Repaso Relevo</span>
      </div>
      <span class="estado" id="estado" data-e="ok" title="Tu avance se guarda solo en este navegador.">Guardado</span>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <a href="#hoy" data-v="hoy">Hoy</a>
      <a href="#casa" data-v="casa">La casa</a>
      <a href="#tarjetas" data-v="tarjetas">Tarjetas y cifras</a>
      <a href="#preguntas" data-v="preguntas">Preguntas</a>
      <a href="#plan" data-v="plan">Plan</a>
      <a href="#avance" data-v="avance">Mi avance</a>
      <a href="#metodo" data-v="metodo">Cómo estudiar</a>
    </nav>
  </header>
  <main id="vista" class="stack"></main>
</div>
<input type="file" id="archivo-copia" accept="application/json,.json" hidden>

<script>
/* ------------------------------------------------------------------ Contenido
   Todo sale de la memoria v8, el guion del examen (documento 49), la ficha de estudio (50), el documento de la
   comisión (51) y el Anexo H (H.8), al 26 de noviembre de 2026. */

const EXAMEN = "2026-12-14";
const PARTES = {
  1: { nombre: "El problema", color: "var(--p1)" },
  2: { nombre: "Lo que investigué", color: "var(--p2)" },
  3: { nombre: "La propuesta", color: "var(--p3)" },
  4: { nombre: "La prueba", color: "var(--p4)" },
};

const FRASES = {
  una: "Relevo es una aplicación para Android y un objeto que suena junto al primer paso de una actividad, para que la persona recuerde a tiempo lo que quería hacer mientras descansa con el teléfono, con la decisión en sus manos.",
  tres: "A veces, mientras descansamos con el celular, una actividad que también queríamos hacer se nos pasa y vuelve cuando ya es tarde. Relevo deja una señal en el lugar donde empieza esa actividad: cuando se cumple el tiempo que la persona se dio, el objeto suena ahí y le recuerda qué quería hacer y cómo empezar. Tres personas lo probaron cinco semanas: casi siempre recordaron a tiempo, pero la prueba no permite decir si fue por el objeto o por el lugar, y eso es lo que sigue.",
};

const ESTACIONES = [
  { n: 1, parte: 1, lugar: "La puerta", titulo: "El problema",
    imagen: "Llegas a casa con ganas de dibujar. Antes, abres el celular un rato. Cuando lo cierras, ya es tarde. Nunca decidiste no dibujar: no te acordaste a tiempo.",
    frase: "“Durante algunas sesiones de ocio digital, una actividad que la persona también quería realizar deja de estar presente y vuelve cuando la oportunidad ya pasó.”", tal: true,
    puntos: [

/* ------------------------------------------------------------------ Estado y guardado
   El avance vive en el navegador (localStorage), con la misma clave que la primera versión, así que no se pierde.
   No hay servidor ni cuentas. Para cambiar de dispositivo se descarga una copia o se copia un código. */
const SITIO = "https://joan1542003-byte.github.io/proyecto-titulo/";
const EN_WEB = location.protocol === "https:" || location.protocol === "http:";
const ULTIMO_REPASO = "2026-12-12";       // todo lo aprendido vuelve al menos una vez antes del examen
const INTERVALO = [0, 1, 2, 4, 7, 12];   // días hasta volver a ver una tarjeta, según su caja
const LS = "repaso-relevo-v1";
const base = () => ({ v: 2, t: 0, lugares: {}, cards: {}, preg: {}, dias: {}, pasos: {}, cifras: {}, estaciones: {}, ajustes: {}, copia: 0, intro: false });
let S = base();
const esObj = (x) => !!x && typeof x === "object" && !Array.isArray(x);
const esFecha = (x) => typeof x === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x);
const IDS = { cards: new Set(TARJETAS.map((c) => c.id)), cifras: new Set(CIFRAS.map((c) => c.id)), preg: new Set(PREGUNTAS.map((q) => q.id)) };
const entero = (x, min, max) => Math.max(min, Math.min(max, parseInt(x, 10) || 0));

/* Revisa todo lo que se lee (del navegador, de una copia o de un código) y descarta lo que no calce. */
function limpiar(o) {
  const b = base(); if (!esObj(o)) return b;
  for (const k of ["cards", "cifras"]) if (esObj(o[k])) for (const [id, v] of Object.entries(o[k])) {
    if (!IDS[k].has(id) || !esObj(v)) continue;
    const st = { b: entero(v.b, 0, 5), n: entero(v.n, 0, 9999), d: esFecha(v.d) ? v.d : hoy() };
    if (["si", "medias", "no"].includes(v.l)) st.l = v.l;
    b[k][id] = st;
  }
  if (esObj(o.preg)) for (const [id, v] of Object.entries(o.preg)) {
    if (!IDS.preg.has(id) || !esObj(v)) continue;
    const st = { n: entero(v.n, 0, 9999) };
    if (["bien", "medias", "trabe"].includes(v.nota)) st.nota = v.nota;
    if (esFecha(v.f)) st.f = v.f;
    b.preg[id] = st;
  }
  if (esObj(o.dias)) for (const [f, v] of Object.entries(o.dias)) if (esFecha(f) && v) b.dias[f] = true;
  if (esObj(o.pasos)) for (const [f, v] of Object.entries(o.pasos)) if (esFecha(f) && esObj(v)) {
    const r = {}; for (const [k, x] of Object.entries(v)) if (/^[a-z0-9]{1,4}$/.test(k) && x) r[k] = true; b.pasos[f] = r;
  }
  if (esObj(o.estaciones)) for (const [n, f] of Object.entries(o.estaciones)) if (/^[1-7]$/.test(n) && esFecha(f)) b.estaciones[n] = f;
  if (esObj(o.lugares)) for (const [n, v] of Object.entries(o.lugares)) if (/^[1-7]$/.test(n) && typeof v === "string") b.lugares[n] = v.slice(0, 40);
  if (esObj(o.ajustes)) {
    const a = o.ajustes;
    if (typeof a.voz === "string") b.ajustes.voz = a.voz.slice(0, 200);
    if ([0.8, 0.9, 1, 1.1, 1.2].includes(a.vel)) b.ajustes.vel = a.vel;
    if ([3, 5, 8].includes(a.pausa)) b.ajustes.pausa = a.pausa;
    if (["auto", "claro", "oscuro"].includes(a.tema)) b.ajustes.tema = a.tema;
    if (typeof a.hora === "string" && /^\d{2}:\d{2}$/.test(a.hora)) b.ajustes.hora = a.hora;
  }
  if (typeof o.copia === "number" && o.copia > 0) b.copia = o.copia;
  if (typeof o.t === "number" && o.t > 0) b.t = o.t;
  b.intro = !!o.intro;
  return b;
}
/* Une el avance de otro dispositivo con el de este, sin perder nada: de cada tarjeta queda la versión más repasada. */
function unir(a, b) {
  const r = limpiar(JSON.parse(JSON.stringify(a)));
  for (const k of ["cards", "cifras"]) for (const [id, v] of Object.entries(b[k])) {
    const x = r[k][id];
    if (!x || v.n > x.n || (v.n === x.n && v.d > x.d)) r[k][id] = v;
  }
  for (const [id, v] of Object.entries(b.preg)) { const x = r.preg[id]; if (!x || v.n > x.n) r.preg[id] = v; }
  for (const f of Object.keys(b.dias)) r.dias[f] = true;
  for (const [f, v] of Object.entries(b.pasos)) r.pasos[f] = Object.assign({}, r.pasos[f], v);
  for (const [n, f] of Object.entries(b.estaciones)) if (!r.estaciones[n]) r.estaciones[n] = f;
  for (const [n, v] of Object.entries(b.lugares)) if (v && !r.lugares[n]) r.lugares[n] = v;
  r.ajustes = Object.assign({}, b.ajustes, r.ajustes);
  r.copia = Math.max(r.copia, b.copia); r.intro = r.intro || b.intro;
  return r;
}

async function protegerAlmacen(manual) {

/* Copias del avance: un archivo o un código para pegar en otro dispositivo. */
function descargar(nombre, tipo, texto) {
  const u = URL.createObjectURL(new Blob([texto], { type: tipo }));
  const a = document.createElement("a"); a.href = u; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}

  let preg = p.preg.slice();
  if (min >= 30) preg = preg.concat(preguntasPendientes().filter((id) => !preg.includes(id)).slice(0, 2));
  if (min <= 5) preg = []; else if (min <= 15) preg = preg.slice(0, 1);
  if (preg.length) pasos.push({ tipo: "preguntas", ids: preg });
  if (p.simulacro && min >= 15) pasos.push({ tipo: "simulacro", n: min >= 30 ? p.simulacro : 3 });

function nombrePaso(ps) {

    case "cifras": { const p = cifrasPendientes(), n = Math.min(ps.n, p.venc.length + p.nuevas.length); return { t: "Cifras", d: n ? `${n} preguntas rápidas de números.` : "Estás al día: se salta." }; }
    case "preguntas": return { t: ps.ids.length > 1 ? `${ps.ids.length} preguntas de la comisión` : "Una pregunta de la comisión", d: "En voz alta, con cronómetro." };

function empezarGuia() {
  const { p } = diaDePlan(), min = minHoy || minutosSugeridos(p);

  guia = { f: p.f, min, pasos: planearSesion(p, min), i: 0, res: {} };
  prepararPaso();
  if (location.hash !== "#hoy") { history.replaceState(null, "", "#hoy"); vista = "hoy"; }
  render(); window.scrollTo(0, 0);
}
function prepararPaso() {
  while (guia && guia.i < guia.pasos.length) {
    const ps = guia.pasos[guia.i];
    if (ps.tipo === "tarjetas" || ps.tipo === "debiles") {
      empezarSesion({ max: ps.max, debiles: ps.tipo === "debiles", guia: true });
      if (sesion.cola.length) return; sesion = null; guia.i += 1; continue;
    }
    if (ps.tipo === "cifras") { empezarQuiz({ n: ps.n, guia: true }); if (quiz.cola.length) return; quiz = null; guia.i += 1; continue; }
    if (ps.tipo === "simulacro") { if (!ps.ids) ps.ids = elegirSimulacro(ps.n); ps.j = ps.j || 0; return; }
    if (ps.tipo === "preguntas") { ps.j = ps.j || 0; return; }
    if (ps.tipo === "cierre") { const pl = planDe(guia.f); if (pl && !pl.examen && !S.dias[guia.f]) { S.dias[guia.f] = true; cambio(); } return; }
    return;
  }
}
function avanzarGuia() { if (!guia) return; pararReloj(); callar(true); guia.i += 1; prepararPaso(); render(); window.scrollTo(0, 0); }

function siguientePregunta() {
  const ps = guia && guia.pasos[guia.i]; if (!ps || !ps.ids) return;
  ps.j += 1; pararReloj();
  if (ps.j >= ps.ids.length) { avanzarGuia(); return; }

function elegirSimulacro(n) {
  const peso = (q) => { const st = S.preg[q.id]; if (!st || !st.n) return 0; return { trabe: 1, medias: 2, bien: 3 }[st.nota] || 2; };
  return PREGUNTAS.map((q) => ({ q, w: peso(q) + Math.random() })).sort((a, b) => a.w - b.w).slice(0, n).map((x) => x.q.id);
}

const icsTexto = (s) => String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
function crearIcs(hora) {
  const [hh, mm] = hora.split(":").map(Number), dos = (n) => String(n).padStart(2, "0");
  const sello = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lin = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Repaso Relevo//ES", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Repaso Relevo"];
  for (const p of PLAN) {
    if (p.f < hoy()) continue;
    const ini = new Date(aFecha(p.f)); ini.setHours(hh, mm, 0, 0);
    const fin = new Date(ini.getTime() + Math.max(10, p.min) * 60000);
    const f = (d) => iso(d).replace(/-/g, "") + "T" + dos(d.getHours()) + dos(d.getMinutes()) + "00";
    const desc = `${p.min} minutos. ${p.nota || "Abre Repaso Relevo y toca Empezar."}` + (EN_WEB ? " " + location.href.split("#")[0] : "");
    lin.push("BEGIN:VEVENT", `UID:repaso-relevo-${p.f}@repaso-relevo`, `DTSTAMP:${sello}`, `DTSTART:${f(ini)}`, `DTEND:${f(fin)}`,
      `SUMMARY:${icsTexto((p.examen ? "" : "Repaso Relevo · ") + p.titulo)}`, `DESCRIPTION:${icsTexto(desc)}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Repaso Relevo", "TRIGGER:-PT0M", "END:VALARM", "END:VEVENT");
  }
  lin.push("END:VCALENDAR");
  return lin.join("\r\n");
}

}
function calificarPregunta(id, nota) {
  const st = Object.assign({ n: 0 }, S.preg[id]); st.n += 1; st.nota = nota; st.f = hoy(); S.preg[id] = st; cambio();

  const ps = guia && guia.pasos[guia.i];
  if (vista === "hoy" && ps && ps.ids && ps.ids[ps.j] === id) { guia.res.preguntas = (guia.res.preguntas || 0) + 1; siguientePregunta(); return; }
  render();
  const d = document.getElementById("pregunta-" + id); if (d) d.open = true;

/* Plan */
function vPlan() {
  let html = "", sem = 0;
  const h = hoy();
  for (const p of PLAN) {
    if (p.sem !== sem) { sem = p.sem; html += `<div class="semana">${esc(SEMANAS[sem])}</div>`; }
    const f = fmtCorto(p.f), tareas = [];
    if (p.estacion) tareas.push(`estación ${p.estacion}${S.estaciones[p.estacion] ? " (ya la sabes)" : ""}`);
    if (p.temas.length) tareas.push("tarjetas: " + p.temas.map((t) => TEMAS[t].nombre.toLowerCase()).join(" y "));
    if (p.preg.length) tareas.push(`${p.preg.length} ${p.preg.length === 1 ? "pregunta" : "preguntas"}`);
    if (p.simulacro) tareas.push(`simulacro de ${p.simulacro}`);
    const atras = !p.examen && p.f < h && !S.dias[p.f];
    html += `<div class="dia${p.f === h ? " hoy" : ""}"><div class="fecha">${esc(f.dia)}<small class="num">${esc(f.num)}</small></div>
      <div class="stack" style="gap:2px"><b>${esc(p.titulo)}</b><span class="small muted">${p.min} min${tareas.length ? " · " + esc(tareas.join(" · ")) : ""}</span>${p.nota ? `<span class="small">${esc(p.nota)}</span>` : ""}${atras ? '<span class="small muted">Sin marcar. Lo que faltó vuelve en tus próximas sesiones.</span>' : ""}</div>
      ${p.examen ? "<span></span>" : `<button class="check" type="button" aria-pressed="${!!S.dias[p.f]}" aria-label="Marcar ${esc(f.dia + " " + f.num)} como hecho" data-act="dia" data-k="${p.f}">${S.dias[p.f] ? ICON.check : ""}</button>`}</div>`;
  }
  const hechos = PLAN.filter((p) => S.dias[p.f]).length;
  return `<section class="card"><h2>El plan</h2><p>Dieciocho días de estudio, de 10 a 45 minutos. La primera semana es corta porque entregas la memoria el 1 de diciembre. La segunda es para recordar sin mirar. La tercera, para ensayar como en el examen.</p>
      <p class="num muted">${hechos} de ${PLAN.length - 2} días hechos.</p><div class="row"><a class="btn" href="#avance">Recordatorios en tu calendario</a></div></section>
    <section class="card planbox">${html}</section>`;
}

/* Mi avance: cómo vas, lo que más cuesta, copias, recordatorios, instalación y ajustes. */
function vAvance() {
  const hechos = PLAN.filter((p) => !p.examen && S.dias[p.f]).length;
  const vistas = Object.keys(S.cards).length, sabidas = TARJETAS.filter((c) => S.cards[c.id] && S.cards[c.id].b >= 3).length;
  const cifOk = CIFRAS.filter((c) => S.cifras[c.id] && S.cifras[c.id].l === "si").length;
  const pq = PREGUNTAS.filter((q) => S.preg[q.id] && S.preg[q.id].n), cuenta = { bien: 0, medias: 0, trabe: 0 };
  pq.forEach((q) => { const n = S.preg[q.id].nota; if (n in cuenta) cuenta[n] += 1; });
  const medidores = Object.entries(TEMAS).map(([k, t]) => {
    const cs = TARJETAS.filter((c) => c.tema === k), col = colorParte(t.parte);
    const a = Math.round(100 * cs.filter((c) => S.cards[c.id] && S.cards[c.id].b >= 3).length / cs.length), b = Math.round(100 * cs.filter((c) => S.cards[c.id]).length / cs.length);
    return `<div class="medidor"><span class="small">${esc(t.nombre)}</span><div class="barra"><i style="width:100%;background:linear-gradient(90deg, ${col} ${a}%, color-mix(in srgb, ${col} 40%, var(--surface-2)) ${a}% ${b}%, transparent ${b}%)"></i></div><span class="small muted num">${cs.filter((c) => S.cards[c.id] && S.cards[c.id].b >= 3).length} de ${cs.length}</span></div>`;
  }).join("");
  const dif = cardsDebiles().sort((x, y) => (S.cards[x.id].b - S.cards[y.id].b) || (S.cards[y.id].n - S.cards[x.id].n)).slice(0, 6);
  const pDif = PREGUNTAS.filter((q) => S.preg[q.id] && (S.preg[q.id].nota === "trabe" || S.preg[q.id].nota === "medias")).slice(0, 6);
  const cDif = CIFRAS.filter((c) => S.cifras[c.id] && S.cifras[c.id].l === "no").slice(0, 6);
  const cuesta = dif.length || pDif.length || cDif.length ? `
      ${dif.length ? `<b>Tarjetas</b><ul class="lista">${dif.map((c) => `<li>${fmt(c.p)}</li>`).join("")}</ul><div class="row"><button class="btn" type="button" data-act="debiles">Repasar las débiles</button></div>` : ""}
      ${cDif.length ? `<b>Cifras</b><ul class="lista">${cDif.map((c) => `<li>${fmt(c.p)}</li>`).join("")}</ul><div class="row"><button class="btn" type="button" data-act="cifras" data-k="falladas">Practicar estas cifras</button></div>` : ""}
      ${pDif.length ? `<b>Preguntas</b><ul class="lista">${pDif.map((q) => `<li><a href="#pregunta-${q.id}">${fmt(q.q)}</a></li>`).join("")}</ul>` : ""}`
    : "<p>Todavía nada. Sigue el plan: lo que no salga aparecerá aquí.</p>";
  const ultima = S.copia ? `Tu última copia es del ${fmtLargo(iso(new Date(S.copia)))}.` : "Aún no guardas una copia.";
  const pers = persistente === true ? " Este navegador no borrará tu avance por falta de espacio." : "";
  const puedePersistir = !!(navigator.storage && navigator.storage.persist) && persistente !== true;
  const ajustes = [
    hayVoz() ? `<label class="campo"><span>Voz para escuchar</span><select data-ajuste="voz">${voces.map((v) => `<option value="${esc(v.voiceURI)}"${vozElegida() === v ? " selected" : ""}>${esc(v.name)} (${esc(v.lang)})${v.localService ? "" : " · usa internet"}</option>`).join("")}</select></label>` : "",
    hayVoz() ? `<label class="campo"><span>Velocidad</span><select data-ajuste="vel">${[[0.8, "Lenta"], [0.9, "Un poco lenta"], [1, "Normal"], [1.1, "Un poco rápida"], [1.2, "Rápida"]].map(([v, n]) => `<option value="${v}"${(S.ajustes.vel || 1) === v ? " selected" : ""}>${n}</option>`).join("")}</select></label>` : "",
    hayVoz() ? `<label class="campo"><span>Tiempo para responder al escuchar</span><select data-ajuste="pausa">${[3, 5, 8].map((v) => `<option value="${v}"${(S.ajustes.pausa || 5) === v ? " selected" : ""}>${v} segundos</option>`).join("")}</select></label>` : "",
    `<label class="campo"><span>Colores</span><select data-ajuste="tema">${[["auto", "Como el sistema"], ["claro", "Claros"], ["oscuro", "Oscuros"]].map(([v, n]) => `<option value="${v}"${(S.ajustes.tema || "auto") === v ? " selected" : ""}>${n}</option>`).join("")}</select></label>`,
  ].join("");
  return `<section class="card"><h2>Mi avance</h2>
      <div class="cifra-grande">
        <div><b class="num">${hechos} de ${PLAN.length - 2}</b><span class="small muted">días hechos</span></div>
        <div><b class="num">${vistas} de ${TARJETAS.length}</b><span class="small muted">tarjetas vistas · ${sabidas} sabidas</span></div>
        <div><b class="num">${cifOk} de ${CIFRAS.length}</b><span class="small muted">cifras acertadas</span></div>
        <div><b class="num">${pq.length} de ${PREGUNTAS.length}</b><span class="small muted">preguntas practicadas</span></div>
        <div><b class="num">${Object.keys(S.estaciones).length} de 7</b><span class="small muted">estaciones que sabes decir</span></div>
      </div>
      <h3>Tarjetas por tema</h3><p class="small muted">En cada barra, la parte fuerte son las sabidas y la suave, las vistas.</p>
      <div class="medidores">${medidores}</div>
      ${pq.length ? `<p class="small">Preguntas: ${cuenta.bien} bien, ${cuenta.medias} más o menos y ${cuenta.trabe} en que te trabaste.</p>` : ""}
    </section>
    <section class="card"><h2>Lo que más cuesta</h2>${cuesta}</section>
    <section class="card"><h2>Tu avance se guarda</h2>
      <p>Se guarda solo, en este navegador. No se sube a ninguna parte y nadie más lo ve. Si borras los datos del navegador, se borra también.</p>
      <p class="small muted">${ultima}${pers}</p>
      <div class="row"><button class="btn primary" type="button" data-act="copia">${ICON.baja}Guardar una copia</button><button class="btn" type="button" data-act="cargar">${ICON.sube}Cargar una copia</button>${puedePersistir ? '<button class="btn ghost" type="button" data-act="proteger">Pedir que no se borre</button>' : ""}</div>
      <h3>Seguir en otro dispositivo</h3>
      <p>Crea un código aquí y pégalo en Mi avance del otro dispositivo. Se une con lo que ya había allá: no se pierde nada. También puedes llevar la copia en archivo.</p>
      <div class="row"><button class="btn" type="button" data-act="codigo">Crear un código</button></div>
      ${codigoHecho ? `<textarea readonly id="codigo-salida" aria-label="Código de tu avance">${esc(codigoHecho)}</textarea><div class="row"><button class="btn" type="button" data-act="copiar-codigo">Copiar el código</button></div>` : ""}
      <label class="campo"><span>Pega aquí un código</span><textarea id="codigo-entrada" placeholder="RR2…" spellcheck="false" autocomplete="off"></textarea></label>
      <div class="row"><button class="btn" type="button" data-act="pegar">Unir este código</button></div>
      ${EN_WEB ? "" : `<p class="small muted">Esta es la copia local. La versión web está en <a href="${SITIO}">${esc(SITIO)}</a>. Para pasar tu avance, guarda una copia aquí y cárgala allá.</p>`}
    </section>
    <section class="card"><h2>Recordatorios</h2>
      <p>Descarga un evento por cada día del plan, desde hoy hasta el examen, con su tarea. Ábrelo con el calendario del teléfono o del computador: te avisará a la hora que elijas.</p>
      <div class="row"><label class="campo"><span>Hora</span><input type="time" id="hora-ics" value="${esc(S.ajustes.hora || "20:00")}"></label><button class="btn primary" type="button" data-act="ics">${ICON.baja}Descargar recordatorios</button></div>
    </section>
    <section class="card"><h2>En el teléfono</h2>
      ${EN_WEB ? "<p>Instálala para abrirla como una app. Funciona sin internet y guarda mejor tu avance.</p>" : `<p>Abre <a href="${SITIO}">${esc(SITIO)}</a> en el teléfono e instálala para abrirla como una app.</p>`}
      <ul class="lista"><li>Android, con Chrome: menú ⋮ › Instalar app o Agregar a la pantalla principal.</li><li>iPhone, con Safari: Compartir › Agregar a inicio.</li></ul>
      ${instalarApp ? '<div class="row"><button class="btn primary" type="button" data-act="instalar">Instalar Repaso Relevo</button></div>' : ""}
    </section>
    <section class="card"><h2>Ajustes</h2><div class="ajustes">${ajustes}</div>${hayVoz() ? "" : '<p class="small muted">Este navegador no tiene voces en español, así que no muestra los botones para escuchar.</p>'}</section>`;
}

/* Cómo estudiar */
function vMetodo() {
  const reglas = [
    ["Un primer paso pequeño", "Empieza siempre igual: di la frase de Relevo en voz alta. Empezar es lo que más cuesta, y un paso concreto lo vuelve fácil. Es el criterio 2 de tu propio proyecto."],
    ["Una señal en un lugar", "Cada parte del proyecto vive en un lugar de tu casa. Al recorrerla en la mente, la historia sale en orden. Es la memoria prospectiva: un lugar trae de vuelta lo que dejaste ahí."],
    ["Recordar antes de mirar", "Cada tarjeta y cada pregunta se responden en voz alta antes de ver la respuesta. Es lo que medía Relevo. El esfuerzo de recordar es lo que fija el recuerdo, aunque te equivoques."],
    ["Volver a lo que cuesta", "Lo que no supiste vuelve hoy o mañana; lo que supiste, en unos días. Así repasas menos y recuerdas más. Todo vuelve al menos una vez antes del 12 de diciembre."],
    ["Ver y oír, no solo leer", "Las cifras se dibujan como puntos y cada estación tiene su imagen. También puedes escuchar las tarjetas y la casa: lo que entra por dos caminos se recuerda mejor."],
    ["Decirlo como en el examen", "En voz alta, con cronómetro y con la fórmula: respuesta, dato y límite. Grábate y escúchate. Si puedes, explícaselo a alguien que no sepa nada del tema."],
    ["Sin culpa", "No hay rachas. Si un día no puedes, sigue al siguiente: el plan se acomoda. Es el criterio 4 de Relevo: nada de evaluar el cumplimiento."],
    ["Dormir", "Lo que repasas antes de dormir se fija mejor. Termina cada día recorriendo la casa."],
  ];
  const mnemos = [
    ["Tres causas", "Te ACOmodas en el sofá: Atención ocupada, Continuidad sin final, Ocio juzgado."],
    ["Tres ámbitos", "Sofá, imán y nudo en el dedo: el ocio, la atención y la memoria."],
    ["Ocho criterios", "2 · 3 · 3: dos de la persona, tres de las decisiones y tres del esfuerzo."],
    ["Tres supuestos", "A-D-S, ADióS al olvido: Asociación, Decisión, Soporte."],
    ["Cuatro momentos", "Pon Su Oído y Decide: Preparar, Seguir, Oír, Decidir."],
    ["Cuatro colores", "Sol el tiempo, cielo el primer paso, pasto el lugar y corazón la decisión."],
    ["Las cifras de la prueba", "21 es la base. 19, 21 y 10: casi todas, todas y la mitad. 23 de 24: todas menos una, fuera de casa."],
    ["Las tres personas", "Empezaron 5, 3 y 2 de 7 veces: cada una un poco menos."],
    ["El tamaño del objeto", "Lo encuentro, lo aprieto, lo imprimo: encontrarlo, controlarlo y fabricarlo. Home mide 52, como las semanas del año."],
  ];
  const decir = TARJETAS.filter((c) => c.tema === "decir");
  return `<section class="card"><h2>Cómo usar Repaso Relevo</h2><ol class="lista">
      <li><b>Cada día: Hoy › Empezar.</b> Elige 5, 15 o 30 minutos y la sesión se arma sola: la frase, la estación del día, las tarjetas, las cifras y las preguntas.</li>
      <li><b>En voz alta, antes de mirar.</b> Después marca si lo supiste. Lo que no sale vuelve pronto.</li>
      <li><b>En el camino, escucha.</b> En Tarjetas y cifras puedes oír las preguntas y responder sin mirar la pantalla.</li>
      <li><b>Grábate.</b> En las preguntas y en la casa, grábate y escúchate: notarás dónde dudas. La grabación no se guarda.</li>
      <li><b>Guarda una copia cada semana.</b> Está en Mi avance. Sirve también para pasar el avance al teléfono o al computador.</li></ol></section>
    <section class="card"><h2>Cómo estudiar</h2>
      <p>Este método usa las mismas ideas que Relevo. Si en el examen te preguntan cómo te preparaste, también es una buena respuesta.</p>
      <ul class="lista">${reglas.map(([t, x]) => `<li><b>${esc(t)}.</b> ${esc(x)}</li>`).join("")}</ul></section>
    <section class="card"><h3>Relevo en tres tamaños</h3><p class="muted small">Aprende primero la frase corta. Cuando salga sola, pasa a la de tres frases. Al final, la casa completa.</p>
      ${bloqueFrase("una", "Una frase")}${bloqueFrase("tres", "Tres frases")}
      <p><b>La casa completa, unos 3 minutos:</b> la frase de 20 segundos de cada lugar, de la puerta a la ventana. <a href="#casa">Ir a la casa</a>.</p></section>
    <section class="card"><h3>Para recordar las listas y las cifras</h3><ul class="lista">${mnemos.map(([t, x]) => `<li><b>${esc(t)}.</b> ${esc(x)}</li>`).join("")}</ul></section>
    <section class="card"><h3>Di esto, no aquello</h3><p class="small muted">Lo que la memoria afirma y lo que no. Decirlo bien muestra rigor.</p>
      <ul class="lista">${decir.map((c) => `<li>${fmt(c.r).replace(/\n/g, "<br>")}</li>`).join("")}</ul><div class="row">${botonVoz("decir")}</div></section>
    <section class="card"><h3>Cómo responder a la comisión</h3>
      <div class="rdl"><div><b>R</b><p><strong>Respuesta:</strong> una frase directa.</p></div><div><b>D</b><p><strong>Dato:</strong> una cifra, un caso o el capítulo.</p></div><div><b>L</b><p><strong>Límite o lo que sigue:</strong> qué no puedes afirmar y cómo lo probarías.</p></div></div>
      <p class="hint"><b>Ejemplo.</b> ¿Por qué un objeto y no una notificación? R: Porque la notificación llega a la misma pantalla que tiene tu atención, y el objeto suena fuera de ella, donde empieza la actividad. D: Con el teléfono, el aviso se notó tarde o no se notó en 10 de 21 respuestas. L: Pero el orden de las etapas no permite decir cuál ayuda más; eso lo compararía el protocolo de 21 días.</p>
      <p>Si una respuesta depende de una decisión tuya, como el sueño o el precio, la pregunta lo dice. Revísala y escríbela con tus palabras.</p></section>
    <section class="card"><h3>El día del examen</h3><ul class="lista"><li>Antes de entrar: respira lento tres veces, di la frase de Relevo y recorre la casa en un minuto.</li><li>Escucha la pregunta entera. Si no la entendiste, pide que la repitan.</li><li>Responde corto: respuesta, dato y límite. Callar después de responder está bien.</li><li>Si te quedas en blanco, usa una frase puente y vuelve a la puerta de tu casa.</li></ul></section>`;
}

/* ------------------------------------------------------------------ Eventos */
function mostrarVista(desdeHash) {
  const h = (location.hash || "#hoy").slice(1);
  let v = h, ancla = null;
  if (h.startsWith("casa-")) { v = "casa"; ancla = h; }
  else if (h.startsWith("pregunta-")) { v = "preguntas"; ancla = h; }
  if (!VISTAS.includes(v)) v = "hoy";
  if (v !== "preguntas") simul = null;
  if (v === "preguntas" && ancla) { filtroQuien = "todas"; soloTuyas = false; }
  vista = v; pararReloj(); render();
  const tab = document.querySelector('nav.tabs a[aria-current="page"]');
  if (tab) { const nav = tab.parentElement; nav.scrollLeft = Math.max(0, tab.offsetLeft - nav.clientWidth / 2 + tab.clientWidth / 2); }
  if (ancla) { const el = document.getElementById(ancla); if (el) { if (el.tagName === "DETAILS") el.open = true; el.scrollIntoView({ block: "start" }); } }
  else if (desdeHash) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => mostrarVista(true));
function irA(hash) { if (location.hash !== hash) location.hash = hash; else { render(); window.scrollTo(0, 0); } }

document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, k = el.dataset.k;
  if (act === "frase") { verFrase[k] = !verFrase[k]; render(); }
  else if (act === "dia") { S.dias[k] = !S.dias[k]; cambio(); render(); }
  else if (act === "min") { minHoy = Number(k); render(); }
  else if (act === "intro-ok") { S.intro = true; cambio(); render(); }
  else if (act === "guia-empezar") empezarGuia();
  else if (act === "guia-sig") avanzarGuia();
  else if (act === "guia-salir") salirGuia();
  else if (act === "guia-saltar") siguientePregunta();
  else if (act === "est-lista") {
    const n = Number(k), ps = guia && guia.pasos[guia.i];
    if (vista === "hoy" && ps && ps.tipo === "estacion") { S.estaciones[n] = hoy(); cambio(); avanzarGuia(); }
    else { if (S.estaciones[n]) delete S.estaciones[n]; else S.estaciones[n] = hoy(); cambio(); render(); }
  }
  else if (act === "destapar") el.classList.remove("oculto");
  else if (act === "destapar-todo") { const a = el.closest("article, section"); if (a) a.querySelectorAll(".oculto").forEach((x) => x.classList.remove("oculto")); }
  else if (act === "empezar") { empezarSesion(); render(); window.scrollTo(0, 0); }
  else if (act === "debiles") { empezarSesion({ debiles: true }); if (!sesion.cola.length) { sesion = null; aviso("No tienes tarjetas débiles."); } irA("#tarjetas"); }
  else if (act === "mazo") { empezarSesion({ tema: k }); render(); window.scrollTo(0, 0); }
  else if (act === "mostrar") { if (sesion) { sesion.vista = true; render(); } }
  else if (act === "nota") { if (sesion) calificar(k); }
  else if (act === "salir") { sesion = null; render(); }
  else if (act === "cifras") { empezarQuiz(k === "todas" ? { todas: true, n: 10 } : k === "falladas" ? { falladas: true } : {}); if (!quiz.cola.length) { quiz = null; aviso("No hay cifras pendientes."); } irA("#tarjetas"); }
  else if (act === "cifra") responderCifra(Number(k));
  else if (act === "cifra-sig") siguienteCifra();
  else if (act === "cifra-salir") { quiz = null; render(); }
  else if (act === "practica") { practica = !practica; render(); }
  else if (act === "reloj") iniciarReloj(k, Number(el.dataset.s));
  else if (act === "pista") { const d = document.querySelector('[data-pista="' + k + '"]'); if (d) d.hidden = false; }
  else if (act === "ver-resp") { document.querySelectorAll('[data-mostrar="' + k + '"], [data-pista="' + k.replace(/^q-/, "") + '"]').forEach((d) => { d.hidden = false; }); pararReloj(); }
  else if (act === "calif") calificarPregunta(el.dataset.id, k);
  else if (act === "filtro") { filtroQuien = k; render(); }
  else if (act === "tuyas") { soloTuyas = !soloTuyas; render(); }
  else if (act === "simulacro") { simul = { ids: elegirSimulacro(Number(k)), i: 0, res: { bien: 0, medias: 0, trabe: 0 }, marcadas: {} }; irA("#preguntas"); }
  else if (act === "sim-sig") { simul.i += 1; pararReloj(); render(); window.scrollTo(0, 0); }
  else if (act === "sim-fin") { simul = null; pararReloj(); render(); }
  else if (act === "voz") { const t = textoVoz(k); hablar(t.items, t.t); }
  else if (act === "voz-mazo") { const s = document.getElementById("voz-mazo"), t = textoVoz("tar-" + (s ? s.value : "hoy")); hablar(t.items, t.t); }
  else if (act === "callar") callar();
  else if (act === "grabar") grabar(k);
  else if (act === "copia") guardarCopia();
  else if (act === "cargar") document.getElementById("archivo-copia").click();
  else if (act === "proteger") protegerAlmacen(true);
  else if (act === "codigo") { codigoHecho = await crearCodigo(); render(); const t = document.getElementById("codigo-salida"); if (t) t.scrollIntoView({ block: "center" }); }
  else if (act === "copiar-codigo") {
    try { await navigator.clipboard.writeText(codigoHecho); aviso("Código copiado."); }
    catch (e) { const t = document.getElementById("codigo-salida"); if (t) { t.focus(); t.select(); } aviso("Selecciónalo y cópialo."); }
  }
  else if (act === "pegar") {
    const t = document.getElementById("codigo-entrada");
    try { recibirAvance(await leerCodigo(t ? t.value : "")); } catch (e) { aviso(/^(Ese|Este)/.test(e.message || "") ? e.message : "No se pudo leer el código. Revisa que esté completo."); }
  }
  else if (act === "ics") {
    const i = document.getElementById("hora-ics"), hora = i && /^\d{2}:\d{2}$/.test(i.value) ? i.value : "20:00";
    S.ajustes.hora = hora; cambio();
    descargar("repaso-relevo-recordatorios.ics", "text/calendar", crearIcs(hora));
    aviso("Ábrelo con tu calendario para agregar los recordatorios.");
  }
  else if (act === "instalar") { if (instalarApp) { instalarApp.prompt(); instalarApp = null; } }
});
document.addEventListener("keydown", (ev) => {
  const t = ev.target;
  if ((ev.key === "Enter" || ev.key === " ") && t.matches && t.matches('[data-act="destapar"], p[data-act="frase"]')) { ev.preventDefault(); t.click(); return; }
  if (ev.altKey || ev.ctrlKey || ev.metaKey || (t.closest && t.closest("input, textarea, select, button, summary, a"))) return;
  const enGuia = vista === "hoy" && !!guia;
  if (sesion && sesion.i < sesion.cola.length && (enGuia ? sesion.guia : vista === "tarjetas" && !sesion.guia)) {
    if (!sesion.vista && (ev.key === " " || ev.key === "Enter")) { ev.preventDefault(); sesion.vista = true; render(); return; }
    if (sesion.vista && ["1", "2", "3"].includes(ev.key)) { ev.preventDefault(); calificar({ 1: "si", 2: "medias", 3: "no" }[ev.key]); return; }
  }
  if (quiz && !quiz.fin && quiz.i < quiz.cola.length && (enGuia ? quiz.guia : vista === "tarjetas" && !quiz.guia)) {
    if (quiz.elegida === null && ["1", "2", "3", "4"].includes(ev.key)) { ev.preventDefault(); responderCifra(Number(ev.key) - 1); return; }
    if (quiz.elegida !== null && ev.key === "Enter") { ev.preventDefault(); siguienteCifra(); }
  }
});
let tLugar = null;
document.addEventListener("input", (ev) => {
  const el = ev.target; if (el.dataset.act !== "lugar") return;
  S.lugares[el.dataset.k] = el.value.slice(0, 40);
  clearTimeout(tLugar); tLugar = setTimeout(() => { cambio(); const c = document.querySelector(".camino"); if (c) c.innerHTML = ESTACIONES.map((e) => `<span>${e.n}. ${esc(nombreLugar(e))}</span>`).join(""); }, 500);
});
document.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (el.id === "archivo-copia") {
    const f = el.files && el.files[0]; el.value = ""; if (!f) return;
    try { recibirAvance(JSON.parse(await f.text())); } catch (e) { aviso("Ese archivo no es una copia de Repaso Relevo."); }
    return;
  }
  const a = el.dataset && el.dataset.ajuste; if (!a) return;
  if (a === "voz") S.ajustes.voz = el.value;
  if (a === "vel") S.ajustes.vel = Number(el.value);
  if (a === "pausa") S.ajustes.pausa = Number(el.value);
  if (a === "tema") { S.ajustes.tema = el.value; aplicarTema(); }
  cambio();
  if (a === "voz" || a === "vel") hablar(["Hola. Así suena esta voz."], "Prueba de voz");
});

/* ------------------------------------------------------------------ Inicio */
function alCambiarVoces() { const antes = voces.length; cargarVoces(); if (!antes && voces.length) render(); }
leerLocal();
aplicarTema();
cargarVoces();
if (VOZ_OK) speechSynthesis.onvoiceschanged = alCambiarVoces;
revisarAlmacen();
mostrarVista(false);
estado("ok");
window.addEventListener("pagehide", () => callar(true));
if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
</script>
