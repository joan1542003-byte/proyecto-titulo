<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Symbol — Relevo</title></head>
<body>
<div id="root"></div>
<script>
  var R = window.Relevo, h = React.createElement;
  function Demo() {
    return h('div', { className: 'rl-demo' }, h('div', { className: 'rl-demo-row', style: { gap: 30, alignItems: 'flex-end' } },
      h(R.Symbol, { size: 72 }), h(R.Symbol, { size: 40, renglon: 'salvia' }), h(R.Symbol, { size: 24 }),
      h('span', { style: { background: 'var(--tinta)', padding: 14, borderRadius: 18, display: 'inline-flex' } }, h(R.Symbol, { size: 32, tone: 'paper' }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
