<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Relevo</title>
<style>
  body { margin: 0; background: var(--paper); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--paper); }
  .cv svg { position: absolute; inset: 0; }
  .b-blue { fill: var(--blue); }
  .dot { fill: var(--paper); }
  .c-moverme { fill: var(--moverme-line); }
  .c-leer { fill: var(--leer-line); }
  .c-crear { fill: var(--crear-line); }
  .c-aprender { fill: var(--aprender-line); }
  .c-cuidar { fill: var(--cuidar-line); }
  .c-compartir { fill: var(--compartir-line); }
  .txt { position: absolute; left: 40px; bottom: 30px; width: 440px; }
  .name { position: relative; display: inline-block; margin: 0; padding-right: 0.527em; font: 600 120px/0.95 var(--font-sans); letter-spacing: -0.022em; color: var(--ink); }
  .name i { display: inline-block; width: 0; height: 0; }
  .name b { position: absolute; left: 0.04em; right: 0; height: 0.078em; border-radius: 9999px; background: var(--blue); }
  .tag { margin: 26px 0 0; font: 400 14px/20px var(--font-sans); color: var(--graphite); }
</style>
</head>
<body>
<div class="cv">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">

      Bloques: blue 440 × 112 (radius-panel) y seis cápsulas de 12 (space-12) en moverme-line, leer-line, crear-line, aprender-line, cuidar-line y compartir-line; cerca de un tercio del cover.
      Disposición: el azul arriba, cortado por el borde derecho, y debajo los renglones de la casa, de largos desiguales, que salen por la derecha como en la portada de la memoria.
      Patrón: trama de puntos (fila «grilla de puntos») en el azul, porque el README hace de la trama un recurso central; siete colores a propósito: son un solo sistema, el azul de Relevo y los seis de la casa en fila.
      Escalas: puntos cada space-24, de trama-dot-min a trama-dot-max; renglones de space-12 cada space-12 + space-8; esquinas radius-panel y cápsulas a la mitad de su alto.

<script>
(function () {
  // El renglón del logotipo: 0,088 em bajo la línea base, 0,078 em de grosor, y pasa la «o» en una altura de x.
  function place() { var n = document.getElementById('nm'), base = n.querySelector('i').offsetTop, em = parseFloat(getComputedStyle(n).fontSize); n.querySelector('b').style.top = (base + 0.088 * em) + 'px'; }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place); place();
})();
</script>
