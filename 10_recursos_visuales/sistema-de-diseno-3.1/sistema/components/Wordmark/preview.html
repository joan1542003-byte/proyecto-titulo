<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Wordmark — Relevo</title></head>
<body>
<div id="root"></div>
<script>
  var R = window.Relevo, h = React.createElement;
  var CATS = ['moverme', 'leer', 'crear', 'aprender', 'cuidar', 'compartir'];
  function Demo() {
    return h('div', { className: 'rl-demo' },
      h('div', { className: 'rl-demo-row', style: { gap: 24 } },
        h(R.Wordmark, { size: 46 }),
        h('span', { style: { background: 'var(--tinta)', padding: '18px 22px', borderRadius: 22, display: 'inline-flex' } }, h(R.Wordmark, { size: 28, tone: 'paper' })),
        h('span', { style: { background: 'var(--azul-500)', padding: '18px 22px', borderRadius: 22, display: 'inline-flex' } }, h(R.Wordmark, { size: 28, tone: 'white' }))),
      h('div', { className: 'rl-demo-row', style: { gap: 22 } }, CATS.map(function (c) { return h('figure', { key: c, style: { margin: 0 } }, h(R.Wordmark, { size: 20, renglon: c }), h('figcaption', { className: 'rl-demo-cap' }, c)); })),
      h('div', { className: 'rl-demo-row' }, h(R.Wordmark, { size: 22, compact: true }), h('span', { className: 'rl-demo-cap' }, 'Compacto: el renglón del ancho de la palabra.')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
