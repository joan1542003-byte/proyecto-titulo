  body { margin: 0; background: var(--paper); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--paper); }
  .cv svg { position: absolute; inset: 0; }
  .b-blue { fill: var(--blue); rx: var(--radius-panel); }
  .b-ink { fill: var(--ink); rx: 20px; }
  .b-tint { fill: var(--azul-200); rx: 20px; }
  .dot { fill: var(--paper); }
  .txt { position: absolute; left: 40px; bottom: 30px; width: 440px; }
  .name { margin: 0; font: 650 120px/0.92 var(--font-sans); letter-spacing: -0.03em; color: var(--ink); text-decoration-line: underline; text-decoration-color: var(--blue); text-decoration-thickness: 0.075em; text-underline-offset: 0.2em; text-decoration-skip-ink: none; }
  .tag { margin: 30px 0 0; font: 400 14px/20px var(--font-sans); color: var(--graphite); }
</style>

      Patrón: trama de puntos (fila «grilla de puntos»), elegida porque el README hace de la trama un recurso central: el punto crece con la sombra.
