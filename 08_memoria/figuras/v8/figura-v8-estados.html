<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Estados de un relevo</title><style>
@font-face{font-family:'IS';src:url('../../memoria-1920x1080/letra/estaticas/InstrumentSans-Regular.ttf');font-weight:400}
@font-face{font-family:'IS';src:url('../../memoria-1920x1080/letra/estaticas/InstrumentSans-Medium.ttf');font-weight:500}
@font-face{font-family:'IS';src:url('../../memoria-1920x1080/letra/estaticas/InstrumentSans-SemiBold.ttf');font-weight:600}
@font-face{font-family:'IS';src:url('../../memoria-1920x1080/letra/estaticas/InstrumentSans-Italic.ttf');font-style:italic}
*{box-sizing:border-box;margin:0;padding:0;background-repeat:no-repeat !important;background-size:100% 100% !important}  /* sin repetir: Chrome dibuja el degradado como vector, no como imagen */
html,body{background:transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:'IS';color:#141312;font-size:20.6pt;line-height:28pt;font-feature-settings:'kern';-webkit-font-smoothing:antialiased}
.ficha{background:#fff;border-radius:26.7pt;padding:26.7pt;position:relative}
.ficha.col{padding:22.3pt}
.sb{font-weight:600} .gris{color:#6E6964}
.cab{font-size:19.9pt;line-height:25pt;font-weight:600;color:#6E6964}
.tit{font-size:23pt;line-height:30pt;font-weight:600}
.ic{display:block;flex:none} .fl{display:block;flex:none;overflow:visible}
.cuad{display:flex;align-items:center;justify-content:center;flex:none}
.n{font-weight:600;font-feature-settings:'tnum'}
.pto{display:block;flex:none;border-radius:50%}
svg.capa{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}

    .lienzo{position:relative;width:100%}
    .fila{position:absolute;left:0;right:0;display:flex;align-items:center}
    .sts{flex:1;display:flex;justify-content:space-between;margin:0 58pt}
    .st{display:flex;align-items:center;gap:10pt;height:54pt;padding:0 20pt 0 18pt;border-radius:999pt}
    .st .tit{font-size:21.5pt;white-space:nowrap}
    .ini{width:18pt;height:18pt;border-radius:50%;background:#141312;flex:none}
    .fin{width:24pt;height:24pt;border-radius:50%;border:2.2pt solid #141312;flex:none;position:relative}
    .fin::after{content:'';position:absolute;left:4.8pt;top:4.8pt;width:10pt;height:10pt;border-radius:50%;background:#141312}
    .rt{position:absolute;color:#6E6964;white-space:nowrap;line-height:25pt}
    @page{size:1741.8pt 258pt;margin:0} body{width:1741.8pt;height:258pt}</style></head><body><div class="ficha"><div class="lienzo"><div class="fila" id="fila"><span class="ini" id="ini"></span><div class="sts"><div class="st" id="borrador" style="background:linear-gradient(100deg,#EEE7FE,#D2D8FB)"><svg class="ic" viewBox="0 0 24 24" width="28pt" height="28pt" style="color:#141312" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-0.348 -0.461)"><path d="M14.6 5.4a2.1 2.1 0 0 1 3 0l1 1a2.1 2.1 0 0 1 0 3L9 19H5v-4z"/><path d="M12.8 7.2l4 4"/><path d="M13.5 20h6"/></g></svg><span class="tit">Borrador</span></div><div class="st" id="listo" style="background:linear-gradient(100deg,#D9F2FE,#BCD9FA)"><svg class="ic" viewBox="0 0 24 24" width="28pt" height="28pt" style="color:#141312" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0.004 -0.398)"><path d="M5 12.5l4.4 4.4L19 7.5"/></g></svg><span class="tit">Listo</span></div><div class="st" id="espera" style="background:linear-gradient(100deg,#FBF0C0,#F6D9A0)"><svg class="ic" viewBox="0 0 24 24" width="28pt" height="28pt" style="color:#141312" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 -0.173)"><path d="M6.5 3.5h11M6.5 20.5h11"/><path d="M8 3.5c0 4.6 4 5.2 4 8.5s-4 3.9-4 8.5M16 3.5c0 4.6-4 5.2-4 8.5s4 3.9 4 8.5"/><path d="M10.2 18.2c.6-.9 1.2-1.4 1.8-1.4s1.2.5 1.8 1.4z"/></g></svg><span class="tit">En espera</span></div><div class="st" id="sonando" style="background:linear-gradient(100deg,#FDE7D6,#F9C9C2)"><svg class="ic" viewBox="0 0 24 24" width="28pt" height="28pt" style="color:#141312" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(-0.035 -0.444)"><path d="M3 12.5A6 6 0 1 0 15 12.5A6 6 0 1 0 3 12.5Z"/><path d="M6.9 13.2A2.1 2.1 0 1 0 11.1 13.2A2.1 2.1 0 1 0 6.9 13.2Z"/><path d="M8.1 8.4A0.9 0.9 0 1 0 9.9 8.4A0.9 0.9 0 1 0 8.1 8.4Z" fill="currentColor" stroke="none"/><path d="M16.4 9.3a4.6 4.6 0 0 1 0 6.4"/><path d="M19 6.5a9 9 0 0 1 0 12"/></g></svg><span class="tit">Sonando</span></div><div class="st" id="silenciado" style="background:linear-gradient(100deg,#F5F1EB,#E5DFD7)"><svg class="ic" viewBox="0 0 24 24" width="28pt" height="28pt" style="color:#141312" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0.307 -0.427)"><path d="M3 12.5A6 6 0 1 0 15 12.5A6 6 0 1 0 3 12.5Z"/><path d="M6.9 13.2A2.1 2.1 0 1 0 11.1 13.2A2.1 2.1 0 1 0 6.9 13.2Z"/><path d="M8.1 8.4A0.9 0.9 0 1 0 9.9 8.4A0.9 0.9 0 1 0 8.1 8.4Z" fill="currentColor" stroke="none"/><path d="M16.5 10l4.5 4.5M21 10l-4.5 4.5"/></g></svg><span class="tit">Silenciado</span></div><div class="st" id="cerrado" style="background:linear-gradient(100deg,#FDE3EC,#EEC9EC)"><svg class="ic" viewBox="0 0 24 24" width="28pt" height="28pt" style="color:#141312" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0.676 0.45)"><path d="M6 20.5V3.8"/><path d="M6 4.5h11.2l-2.4 3.9 2.4 3.9H6"/></g></svg><span class="tit">Cerrado</span></div></div><span class="fin" id="fin"></span></div><div class="rt" id="r0">Completa los datos</div><div class="rt" id="r1">Activa el relevo</div><div class="rt" id="r2">Se cumple el tiempo</div><div class="rt" id="r3">Lo silencia</div><div class="rt" id="r4">Responde</div><div class="rt" id="ra">Lo edita</div><div class="rt" id="rc">Responde sin silenciar</div><div class="rt" id="rb">Lo desactiva o elimina</div></div></div><script>
const PX=0.75;
function r(id){const f=document.querySelector('.ficha').getBoundingClientRect(),e=document.getElementById(id).getBoundingClientRect();
return {x:(e.left-f.left)*PX,y:(e.top-f.top)*PX,w:e.width*PX,h:e.height*PX,get cx(){return this.x+this.w/2},get cy(){return this.y+this.h/2},get b(){return this.y+this.h},get d(){return this.x+this.w}};}
function capa(){const f=document.querySelector('.ficha'),b=f.getBoundingClientRect();let s=f.querySelector('svg.capa');
if(!s){s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','capa');f.appendChild(s);}
s.setAttribute('viewBox',`0 0 ${b.width*PX} ${b.height*PX}`);return s;}
const T='#141312';
function trazo(d,g=2.4){return `<path d="${d}" fill="none" stroke="${T}" stroke-width="${g}" stroke-linecap="round" stroke-linejoin="round"/>`;}
function punta(x,y,dir,g=2.4){const k=8.5;const d={d:`M${x-k} ${y-k*.85}L${x} ${y}L${x-k} ${y+k*.85}`,i:`M${x+k} ${y-k*.85}L${x} ${y}L${x+k} ${y+k*.85}`,
a:`M${x-k*.85} ${y+k}L${x} ${y}L${x+k*.85} ${y+k}`,b:`M${x-k*.85} ${y-k}L${x} ${y}L${x+k*.85} ${y-k}`}[dir];return trazo(d,g);}
</script><script>document.fonts.ready.then(()=>{
    const L=document.querySelector('.lienzo'),F=document.getElementById('fila');
    const ids=['borrador','listo','espera','sonando','silenciado','cerrado'];
    const g=x=>document.getElementById(x),tam=e=>{const b=e.getBoundingClientRect();return {w:b.width*PX,h:b.height*PX};};
    // Todo se calcula en pt, relativo a la ficha; los rótulos se colocan relativos al lienzo.
    const fb=document.querySelector('.ficha').getBoundingClientRect(),lb=L.getBoundingClientRect();
    const ox=(lb.left-fb.left)*PX,oy=(lb.top-fb.top)*PX;
    const pon=(e,x,y)=>{e.style.left=(x-ox)+'pt';e.style.top=(y-oy)+'pt';},centro=(e,x,y)=>pon(e,x-tam(e).w/2,y);
    // De arriba abajo: rótulos de los caminos de arriba, sus líneas, rótulos de las flechas, la fila; abajo, un camino y su rótulo.
    const hr=tam(g('r0')).h,h2=27,Y0=oy+hr+8+16+hr+10+h2;
    F.style.top=(Y0-h2-oy)+'pt';
    const p={};ids.forEach(k=>p[k]=r(k));
    for(let k=0;k<5;k++){const a=p[ids[k]],b=p[ids[k+1]];centro(g('r'+k),(a.d+b.x)/2,Y0-h2-10-hr);}
    const ya=Y0-h2-10-hr-16,yb=Y0+h2+30,R=14,ini=r('ini'),fin=r('fin');
    let h=trazo(`M${ini.d+5} ${Y0}H${p.borrador.x-7}`,2.2)+punta(p.borrador.x-7,Y0,'d',2.2);
    for(let k=0;k<5;k++){const a=p[ids[k]],b=p[ids[k+1]];h+=trazo(`M${a.d+7} ${Y0}H${b.x-7}`,2.2)+punta(b.x-7,Y0,'d',2.2);}
    h+=trazo(`M${p.cerrado.d+7} ${Y0}H${fin.x-6}`,2.2)+punta(fin.x-6,Y0,'d',2.2);
    const arco=(x1,x2,y,arriba)=>{const s=x2>x1?1:-1,v=arriba?1:-1,y0=arriba?Y0-h2-6:Y0+h2+6,y1=arriba?Y0-h2-7:Y0+h2+7;
      return trazo(`M${x1} ${y0}V${y+R*v}Q${x1} ${y} ${x1+R*s} ${y}H${x2-R*s}Q${x2} ${y} ${x2} ${y+R*v}V${y1}`,2.2)+punta(x2,y1,arriba?'b':'a',2.2);};
    h+=arco(p.espera.cx,p.borrador.cx,ya,true)+arco(p.sonando.cx,p.cerrado.cx,ya,true)+arco(p.espera.cx,p.cerrado.cx,yb,false);
    centro(g('ra'),(p.espera.cx+p.borrador.cx)/2,ya-8-hr);
    centro(g('rc'),(p.sonando.cx+p.cerrado.cx)/2,ya-8-hr);
    centro(g('rb'),(p.espera.cx+p.cerrado.cx)/2,yb+8);
    L.style.height=(yb+8+hr+2-oy)+'pt';
    const s=capa();s.innerHTML=h;
    });</script></body></html>
