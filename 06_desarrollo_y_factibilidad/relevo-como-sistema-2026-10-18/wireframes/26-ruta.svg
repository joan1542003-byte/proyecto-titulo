<text x="72" y="559" dominant-baseline="central" font-size="12.9" font-weight="700" fill="#2b2b2b">Leer 10 páginas</text>
<text x="72" y="576.6666666666666" dominant-baseline="central" font-size="11.8" font-weight="700" fill="#2b2b2b">Ahora</text>
<text x="42.666666666666664" y="620" dominant-baseline="central" font-size="13.7" font-weight="700" fill="#2b2b2b">2</text>
<text x="72" y="619.8333333333334" dominant-baseline="central" font-size="12.8" font-weight="700" fill="#2b2b2b">Leer un capítulo de manga</text>
<text x="180" y="677.6666666666666" dominant-baseline="central" font-size="12.9" font-weight="700" fill="#ffffff" text-anchor="middle">Preparar un relevo con este paso</text>
