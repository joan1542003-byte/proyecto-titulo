<text x="17.666666666666668" y="93.83333333333333" dominant-baseline="central" font-size="25.1" font-weight="700" fill="#2b2b2b">Tu ruta</text>
<text x="17.666666666666668" y="129.16666666666669" dominant-baseline="central" font-size="17.0" font-weight="700" fill="#2b2b2b">Pasos pequeños hacia lo que te</text>
<text x="17.666666666666668" y="152.16666666666669" dominant-baseline="central" font-size="17.0" font-weight="700" fill="#2b2b2b">gustaría hacer más seguido.</text>
<text x="44" y="401.6666666666667" dominant-baseline="central" font-size="11.8" font-weight="700" fill="#2b2b2b">Ahora</text>
<text x="95" y="401.6666666666667" dominant-baseline="central" font-size="9.0" font-weight="700" fill="#2b2b2b">Leer · paso 1 de 3</text>
<text x="35.333333333333336" y="437.1666666666667" dominant-baseline="central" font-size="20.8" font-weight="700" fill="#2b2b2b">Leer 10 páginas</text>
<text x="35.333333333333336" y="465.3333333333333" dominant-baseline="central" font-size="10.1" font-weight="700" fill="#2b2b2b">Empieza por abrir el libro, en el velador.</text>
<text x="21.333333333333332" y="525.8333333333334" dominant-baseline="central" font-size="12.0" font-weight="400" fill="#555">Todos los pasos</text>
