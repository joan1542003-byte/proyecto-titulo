<text x="49.333333333333336" y="407" dominant-baseline="central" font-size="10.0" font-weight="400" fill="#555">Suena en el teléfono</text>
<text x="17.666666666666668" y="449" dominant-baseline="central" font-size="16.4" font-weight="700" fill="#2b2b2b">Es momento de volver a elegir</text>
<text x="17.666666666666668" y="488.5" dominant-baseline="central" font-size="27.4" font-weight="700" fill="#2b2b2b">Vuelve a leer</text>
<text x="17.666666666666668" y="525.5" dominant-baseline="central" font-size="27.4" font-weight="700" fill="#2b2b2b">10 páginas.</text>
<text x="17.666666666666668" y="568.6666666666667" dominant-baseline="central" font-size="18.3" font-weight="700" fill="#2b2b2b">Empieza por abrir el</text>
<text x="17.666666666666668" y="593.3333333333334" dominant-baseline="central" font-size="18.3" font-weight="700" fill="#2b2b2b">libro, en el velador.</text>
<text x="120.33333333333333" y="744" dominant-baseline="central" font-size="12.4" font-weight="700" fill="#ffffff">Silenciar y continuar</text>
