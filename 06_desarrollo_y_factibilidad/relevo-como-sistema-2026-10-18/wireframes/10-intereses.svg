<text x="17.666666666666668" y="93.33333333333333" dominant-baseline="central" font-size="26.6" font-weight="700" fill="#2b2b2b">¿Qué te gustaría</text>
<text x="17.666666666666668" y="129.33333333333331" dominant-baseline="central" font-size="26.6" font-weight="700" fill="#2b2b2b">hacer más seguido?</text>
<text x="17.666666666666668" y="178.16666666666666" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#555">Elige una o varias.</text>
<text x="17.666666666666668" y="360" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#2b2b2b">Dormir a tiempo</text>
