<text x="17.666666666666668" y="527.6666666666666" dominant-baseline="central" font-size="12.7" font-weight="700" fill="#2b2b2b">Hacer ejercicio</text>
<text x="185.33333333333334" y="527.6666666666666" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#2b2b2b">Salir en bicicleta</text>
<text x="17.666666666666668" y="694.0833333333333" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2b2b2b">Pasear o jugar</text>
<text x="17.666666666666668" y="710.9166666666666" dominant-baseline="central" font-size="12.5" font-weight="700" fill="#2b2b2b">con tu perro</text>
<text x="185.33333333333334" y="695.3333333333333" dominant-baseline="central" font-size="12.2" font-weight="700" fill="#2b2b2b">Dibujar o pintar</text>
