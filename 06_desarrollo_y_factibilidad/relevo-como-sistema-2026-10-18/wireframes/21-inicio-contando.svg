<text x="17.666666666666668" y="83.33333333333333" dominant-baseline="central" font-size="10.7" font-weight="400" fill="#555">Lunes 19 de octubre</text>
<text x="17.666666666666668" y="115.16666666666667" dominant-baseline="central" font-size="25.7" font-weight="700" fill="#2b2b2b">Hola, Prueba.</text>
<text x="67" y="368.6666666666667" dominant-baseline="central" font-size="11.8" font-weight="700" fill="#2b2b2b">Contando</text>
<text x="35.333333333333336" y="408.5" dominant-baseline="central" font-size="19.7" font-weight="700" fill="#2b2b2b">Vuelve a leer 10 páginas.</text>
<text x="35.333333333333336" y="438.3333333333333" dominant-baseline="central" font-size="10.6" font-weight="700" fill="#2b2b2b">Sonará en el teléfono.</text>
<text x="35.333333333333336" y="480.3333333333333" dominant-baseline="central" font-size="9.3" font-weight="700" fill="#2b2b2b">0 s</text>
<text x="51" y="480.3333333333333" dominant-baseline="central" font-size="9.9" font-weight="700" fill="#2b2b2b">de 15 s</text>
<text x="21.333333333333332" y="525.5" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#555">Tu relevo</text>
<text x="72" y="564.1666666666666" dominant-baseline="central" font-size="13.9" font-weight="400" fill="#555">Para empezar</text>
<text x="243" y="564.1666666666666" dominant-baseline="central" font-size="10.9" font-weight="400" fill="#555">Abrir el libro</text>
<text x="72" y="611.8333333333334" dominant-baseline="central" font-size="14.4" font-weight="400" fill="#555">Dónde empiezas</text>
<text x="238.66666666666666" y="611.8333333333334" dominant-baseline="central" font-size="12.3" font-weight="400" fill="#555">En el velador</text>
<text x="72" y="650.5" dominant-baseline="central" font-size="8.5" font-weight="400" fill="#555">Suena</text>
<text x="256.3333333333333" y="650.5" dominant-baseline="central" font-size="8.5" font-weight="400" fill="#555">El teléfono</text>
<text x="72" y="709.3333333333334" dominant-baseline="central" font-size="10.9" font-weight="400" fill="#555">Apps que cuentan</text>
<text x="289" y="709.3333333333334" dominant-baseline="central" font-size="10.9" font-weight="400" fill="#555">Clock</text>
<text x="72" y="765.1666666666666" dominant-baseline="central" font-size="8.5" font-weight="400" fill="#555">Falta</text>
<text x="210" y="765.1666666666666" dominant-baseline="central" font-size="8.5" font-weight="400" fill="#555">15 s en esas apps</text>
<text x="72" y="795.5" dominant-baseline="central" font-size="8.5" font-weight="700" fill="#2b2b2b">Ver, editar o desactivar</text>
<text x="147" y="677.6666666666666" dominant-baseline="central" font-size="12.7" font-weight="700" fill="#ffffff">Ver mi relevo</text>
