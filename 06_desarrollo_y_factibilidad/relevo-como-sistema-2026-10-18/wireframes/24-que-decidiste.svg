<text x="87.66666666666667" y="205.66666666666669" dominant-baseline="central" font-size="15.8" font-weight="400" fill="#555">Vuelve a leer 10 páginas.</text>
<text x="17.666666666666668" y="258.6666666666667" dominant-baseline="central" font-size="13.1" font-weight="400" fill="#555">¿Cómo te cayó el sonido?</text>
