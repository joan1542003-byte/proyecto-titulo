<text x="17.666666666666668" y="602.1666666666666" dominant-baseline="central" font-size="26.1" font-weight="700" fill="#2b2b2b">¿Qué decidiste?</text>
<text x="118" y="661" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#2b2b2b">Comencé la actividad</text>
