<text x="35.333333333333336" y="576" dominant-baseline="central" font-size="13.8" font-weight="400" fill="#555">Si pasas una semana sin abrir</text>
<text x="35.333333333333336" y="594.6666666666666" dominant-baseline="central" font-size="13.8" font-weight="400" fill="#555">Relevo, te avisa una vez.</text>
