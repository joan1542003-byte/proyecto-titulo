<text x="251" y="642.6666666666667" dominant-baseline="central" font-size="10.1" font-weight="700" fill="#2b2b2b" text-anchor="middle">Sí</text>
<text x="35.333333333333336" y="719.3333333333333" dominant-baseline="central" font-size="14.1" font-weight="400" fill="#555">Mensaje después de responder</text>
<text x="35.333333333333336" y="745.3333333333334" dominant-baseline="central" font-size="11.4" font-weight="400" fill="#555">Unas palabras cuando cuentas qué decidiste.</text>
